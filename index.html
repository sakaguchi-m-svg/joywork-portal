<style>
  body { font-family: Manrope, "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; }
  .font-head { letter-spacing: -.02em; }
  :focus-visible { outline: 2px solid #2A4A9E; outline-offset: 2px; border-radius: 4px; }

  /* campos de formulário / 入力欄 */
  .field {
    display: block; width: 100%; min-height: 44px; padding: .55rem .75rem;
    border: 1px solid #CBD5E1; border-radius: .5rem; background: #fff;
    font-size: 15px; color: #0F1E33; line-height: 1.45;
  }
  .field:focus { outline: none; border-color: #2A4A9E; box-shadow: 0 0 0 3px rgba(42,74,158,.15); }
  .field:disabled { background: #F1F5F9; color: #94A3B8; }
  textarea.field { resize: vertical; }
  .field.pl-10 { padding-left: 2.5rem; }

  /* folha original: campos por cima da imagem / 原紙の上の記入欄 */
  .mdl { position: relative; background-color: #fff;
         font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; color: #111; }
  .mdl-i { position: absolute; border: 0; margin: 0; padding: 0 3px; border-radius: 3px; color: #111;
           background: rgba(255, 226, 120, .38); font-family: inherit; line-height: 1; }
  .mdl-i:focus { outline: none; background: rgba(255, 214, 90, .6); box-shadow: 0 0 0 2px #2A4A9E; }
  .mdl-t { position: absolute; display: flex; align-items: center; white-space: nowrap; overflow: visible;
           padding: 0 3px; line-height: 1.2; color: #111; }
  .mdl-x, .mdl-sign { position: absolute; display: flex; align-items: center; justify-content: center;
           border: 1.5px dashed #2A4A9E; border-radius: 3px; background: rgba(255, 226, 120, .38);
           color: #111; font-weight: 700; padding: 0; line-height: 1; }
  .mdl-sign span { font-size: 12px; font-weight: 600; color: #2A4A9E; }

  <p class="font-bold" data-i18n="erroPagina">Erro na página</p>
  <p id="erroTexto" class="mt-1 break-words"></p>

<script>
  // mostra qualquer erro na tela, para diagnosticar em celular sem console
  (function () {
    function mostra(msg) {
      var f = document.getElementById('erroFaixa');
      var t = document.getElementById('erroTexto');
      if (!f || !t) { return; }
      t.textContent = String(msg);
      f.className = f.className.replace('hidden', '');
    }
    window.addEventListener('error', function (e) {
      mostra((e.message || 'erro') + ' — ' + (e.filename || '') + ':' + (e.lineno || '?'));
    });
    window.addEventListener('unhandledrejection', function (e) {
      mostra('promessa rejeitada: ' + ((e.reason && e.reason.message) || e.reason));
    });
    window.__mostraErro = mostra;
  })();
</script>

/* Ligação com o servidor (Google Apps Script).
   Quando o portal é servido pelo Apps Script, google.script.run existe e tudo
   é lido e gravado lá. Quando o arquivo é aberto direto no navegador, nada
   disso existe: o portal entra em MODO DEMONSTRAÇÃO e trabalha na memória
   da aba, que é como testamos até agora. */
const CONECTADO = typeof google !== 'undefined' && !!(google.script && google.script.run);

/* Erros do servidor chegam como "[codigo:extra] texto pt / ja". O código vira a
   mensagem no idioma de quem está usando; erro sem código passa como veio.
   サーバーのエラーはコード付きで届きます。コードから利用者の言語で表示します。 */
function erroTraduzido(bruto) {
  const m = /^\[(\w+)(?::([^\]]*))?\]\s*/.exec(String(bruto || ''));
  if (!m) return new Error(String(bruto || ''));
  const modelo = t()['e_' + m[1]];
  const err = new Error(typeof modelo === 'string' ? fmt(modelo, { n: m[2] || '' }) : String(bruto).slice(m[0].length));
  err.codigo = m[1];
  return err;
}

function servidor(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(e => reject(erroTraduzido(e && e.message ? e.message : String(e))))
      [fn].apply(null, args);
  });
}

/* Sessão do líder: um código aleatório que o servidor deu no login. Vai junto
   em toda chamada que edita; o servidor confere de novo a cada vez.
   リーダーのセッション。編集する呼び出しのたびに送り、サーバーが毎回確認します。 */
const CHAVE_LIDER = 'joywork-lider';
let TOKEN_LIDER = '';
try { TOKEN_LIDER = localStorage.getItem(CHAVE_LIDER) || ''; } catch (e) {}
let LIDER = null;                       // { nome, codigo } quando conectado como líder
function guardaToken(tk) {
  TOKEN_LIDER = tk || '';
  try { tk ? localStorage.setItem(CHAVE_LIDER, tk) : localStorage.removeItem(CHAVE_LIDER); } catch (e) {}
}
/** Chamada que edita: acrescenta o token do líder no fim. / 編集用の呼び出し。 */
function servidorEd(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return servidor.apply(null, [fn].concat(args, [TOKEN_LIDER]));
}

/* Carimbo da versão que este navegador carregou.
   O servidor devolve um carimbo novo a cada gravação. Se dois administradores
   editarem ao mesmo tempo, o segundo a salvar chega com um carimbo velho e o
   servidor recusa, em vez de apagar o trabalho do primeiro em silêncio. */
let VERSAO_CONTEUDO = '';

async function loadContent() {
  if (!CONECTADO) return DATA;
  // com o token do líder o servidor devolve também os e-mails dos destinatários
  // リーダーのトークンがあれば、送信先メールも含めて返されます
  const resposta = await servidor('getContent', TOKEN_LIDER);
  let vindo = resposta;
  if (resposta && typeof resposta === 'object' && 'dados' in resposta) {
    VERSAO_CONTEUDO = resposta.versao || '';
    vindo = resposta.dados;
  }
  return vindo ? { ...defaultContent(), ...vindo } : defaultContent();
}

/* registro descreve, para o histórico da planilha, o que acabou de ser feito:
   { acao:'publicado'|'editado'|'apagado', tipo:'aviso'|'funcionario'|…,
     id, setor, titulo, detalhe } */
async function saveContent(next, registro) {
  if (!CONECTADO) { DATA = next; return true; }
  try {
    const r = await servidorEd('saveContent', next, VERSAO_CONTEUDO, registro || null);
    if (r && r.versao) VERSAO_CONTEUDO = r.versao;
    DATA = next;                       // só depois que o servidor confirmou
    return true;
  } catch (e) {
    avisarFalhaAoSalvar(e);
    return false;                      // DATA continua como estava
  }
}

/* O servidor fala em português e japonês, porque quem publica é a
   administração. A mensagem dele é mostrada como veio. */
function avisarFalhaAoSalvar(e) {
  const msg = (e && e.message) ? e.message : t().erroSalvar;
  const codigo = (e && e.codigo) || '';
  // sessão de líder vencida no meio da edição / 編集中にリーダーの期限切れ
  if (role === 'leader' && codigo === 'semPermissao') { sairDoLider(t().ldExpired); return; }
  const conflito = codigo === 'conflito';
  toast(msg, conflito ? 9000 : 4000);
  if (conflito) barraDeConflito(msg);
}

/* Faixa fixa no topo, com botão de recarregar. Some sozinha se a pessoa

  let el = document.getElementById('faixaConflito');
  if (!el) {

      class="min-h-[36px] shrink-0 rounded-lg bg-white px-3 py-1.5 text-[13px] font-semibold text-amberdark">

function rotuloHist(v) {

}

   Um campo preenchível guarda { pt, en, ja, es, id }. Textos antigos que
   são string continuam valendo e contam como português. */
const LANGS = ['pt','en','ja','es','id'];
const LANG_NAME = { pt:'Português', en:'English', ja:'日本語', es:'Español', id:'Bahasa Indonesia' };
const mlVazio = () => ({ pt:'', en:'', ja:'', es:'', id:'' });
const paraMl = v => (typeof v === 'string' ? { ...mlVazio(), pt: v } : { ...mlVazio(), ...(v || {}) });
const mlTem = v => LANGS.some(l => (paraMl(v)[l] || '').trim());

/* Data no idioma de quem lê: "há 2 horas", "2 hours ago", "2 時間前"…
   Fica guardada como data (em). Texto antigo (when) aparece como foi escrito.
   日時は閲覧者の言語で表示します。旧形式の文字列（when）はそのまま表示します。 */
function quando(x) {
  const em = x && x.em ? new Date(x.em) : null;
  if (!em || isNaN(em.getTime())) return (x && x.when) || '';
  const loc = t()._locale;
  const seg = Math.round((em.getTime() - Date.now()) / 1000);
  const abs = Math.abs(seg);
  try {
    const rtf = new Intl.RelativeTimeFormat(loc, { numeric: 'auto' });
    if (abs < 60) return rtf.format(0, 'second');
    if (abs < 3600) return rtf.format(Math.round(seg / 60), 'minute');
    if (abs < 86400) return rtf.format(Math.round(seg / 3600), 'hour');
    if (abs < 7 * 86400) return rtf.format(Math.round(seg / 86400), 'day');
  } catch (e) {}
  return em.toLocaleDateString(loc, { day: 'numeric', month: 'short', year: 'numeric' });
}

function txt(v) {                       // o texto certo para quem está lendo
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if ((v[lang] || '').trim()) return v[lang];
  for (const l of LANGS) if ((v[l] || '').trim()) return v[l];
  return '';
}
function txtLang(v) {                   // em que idioma o texto acabou saindo
  if (v == null || typeof v === 'string') return null;
  if ((v[lang] || '').trim()) return lang;
  for (const l of LANGS) if ((v[l] || '').trim()) return l;
  return null;
}

}

              <img src="${esc(draft.photo.url || draft.photo.dataUrl || draft.photo)}" alt="" class="h-16 w-16 rounded-lg border border-line object-cover">
              <button id="cPhotoRm" class="min-h-[44px] rounded-lg border border-line px-3 text-[13px] font-semibold text-slate-500 hover:bg-red-50 hover:text-red-600">${t().nPhotoRemove}</button>

  );
  document.querySelectorAll('[data-dlang]').forEach(b => b.addEventListener('click', () => {
    draft.tag[draftLang]   = document.getElementById('cTag').value;
    draft.title[draftLang] = document.getElementById('cTitle').value;
    draft.body[draftLang]  = document.getElementById('cBody').value;
    draftLang = b.dataset.dlang;
    renderComposer();
  }));
  const guardaTexto = () => {
    draft.tag[draftLang]   = document.getElementById('cTag').value;
    draft.title[draftLang] = document.getElementById('cTitle').value;
    draft.body[draftLang]  = document.getElementById('cBody').value;
  };
  const cErro = msg => {
    const e = document.getElementById('cErr');
    e.classList.remove('hidden'); e.classList.add('flex');
    e.querySelector('span').textContent = msg;
  };

  const ctr = document.getElementById('cTr');

  });

  const fp = document.getElementById('cPhoto');
  if (fp) fp.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    guardaTexto();
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1280;
        const escala = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * escala);
        cv.height = Math.round(img.height * escala);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        draft.photo = { dataUrl: cv.toDataURL('image/jpeg', 0.7) };
        renderComposer();
      };
      img.onerror = () => cErro(t().fbPhotoBig);
      img.src = leitor.result;
    };
    leitor.readAsDataURL(f);
  });
  const fpr = document.getElementById('cPhotoRm');
  if (fpr) fpr.addEventListener('click', () => { guardaTexto(); draft.photo = null; renderComposer(); });

  // PDF
  const dp = document.getElementById('cPdf');
  if (dp) dp.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    guardaTexto();
    const ehPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    if (!ehPdf) return cErro(t().docOnlyPdf);
    if (f.size > DOC_MAX) return cErro(t().docTooBig);
    const leitor = new FileReader();
    leitor.onload = () => {
      draft.doc = { name: f.name.replace(/\.pdf$/i, ''), dataUrl: String(leitor.result) };
      renderComposer();
    };
    leitor.readAsDataURL(f);
  });
  const dpr = document.getElementById('cPdfRm');
  if (dpr) dpr.addEventListener('click', () => { guardaTexto(); draft.doc = null; renderComposer(); });

  document.getElementById('cSend').addEventListener('click', submitNotice);
  const cc = document.getElementById('cCancel');
  if (cc) cc.addEventListener('click', () => { editingId = null; draft = { sector: activeSector || 'all', tag:mlVazio(), title:mlVazio(), body:mlVazio(), photo:null, doc:null, destaque:false }; renderComposer(); });
  lucide.createIcons();
}

async function submitNotice() {
  const { sector, tag, title, body } = draft;
  const destaque = !!draft.destaque;
  const completo = LANGS.some(l => (tag[l] || '').trim() && (title[l] || '').trim() && (body[l] || '').trim());
  if (!completo) {
    const err = document.getElementById('cErr');
    err.classList.remove('hidden'); err.classList.add('flex');
    err.querySelector('span').textContent = t().mlNeedOne;
    return;
  }
  // anexos novos sobem para o Drive; os que já têm link ficam como estão
  if (CONECTADO) {
    try {
      if (draft.photo && draft.photo.dataUrl && !draft.photo.url) {
        const r = await servidorEd('uploadDocumento', 'aviso-foto', draft.photo.dataUrl.split(',')[1], 'image/jpeg');
        draft.photo = { url: r.url, fileId: r.id };
      }
      if (draft.doc && draft.doc.dataUrl && !draft.doc.url) {
        const r = await servidorEd('uploadDocumento', draft.doc.name || 'aviso', draft.doc.dataUrl.split(',')[1], 'application/pdf');
        draft.doc = { name: draft.doc.name, url: r.url, fileId: r.id };
      }
    } catch (e) {
      const err = document.getElementById('cErr');
      err.classList.remove('hidden'); err.classList.add('flex');
      err.querySelector('span').textContent = e.message;
      return;
    }
  }

  const next = structuredClone(DATA);
  let idAviso = editingId;
  if (editingId) {
    const i = next.notices.findIndex(n => n.id === editingId);
    next.notices[i] = { ...next.notices[i], sector, tag, title, body, photo: draft.photo, doc: draft.doc, destaque };
  } else {
    idAviso = newId();
    next.notices.unshift({ id:idAviso, sector, tag, title, body, em: new Date().toISOString(),
                           photo: draft.photo, doc: draft.doc, destaque });
  }
  const msg = editingId ? t().nUpd : t().nDone;
  const ok = await saveContent(next, {
    acao: editingId ? 'editado' : 'publicado', tipo: 'aviso', id: idAviso, setor: sector,
    titulo: rotuloHist(title), detalhe: (destaque ? '★ destaque / 注目 · ' : '') + rotuloHist(body)
  });
  if (!ok) return;
  editingId = null;
  draft = { sector: activeSector || 'all', tag:mlVazio(), title:mlVazio(), body:mlVazio(), photo:null, doc:null, destaque:false };
  renderSection();
  toast(msg);
}

const FM_ICONS = ['file-text','calendar-days','wrench','clipboard-check','hard-hat','truck','clock','triangle-alert','sparkles','badge-check'];

const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim());
// formulários e fichas do feedback usam o mesmo formato / フォームとシートは同じ形式
const formPorId = id => (DATA.forms || []).concat(DATA.fichas || []).find(x => x.id === id) || null;
const ehFicha = f => !!f && f.kind === 'ficha';
const visibleFichas = () => (DATA.fichas || []).filter(f => !activeSector || f.sector === 'all' || f.sector === activeSector);
// tem o que preencher no portal: campos próprios ou a folha original / 記入項目または原紙あり
const fmTemCampos = f => !!f && (!!f.modelo || (Array.isArray(f.fields) && f.fields.length > 0));

/* Um campo de formulário. Textos em { pt, en, ja, es, id }, como os avisos.
   フォームの項目。文言はお知らせと同じく多言語で保存します。 */
function normalizaCampo(c) {
  const tipo = FM_TYPES.indexOf(c && c.type) >= 0 ? c.type : 'text';
  return {
    id: (c && c.id) || novoIdCampo(),
    type: tipo,
    label: paraMl(c && c.label),
    required: !!(c && c.required),
    exempt: tipo === 'check' && !!(c && c.exempt),
    options: tipo === 'choice' ? ((c && c.options) || []).map(paraMl) : []
  };
}

/* Todos os textos multilíngues de um formulário em edição, na ordem da tela.

  .concat(...d.fields.map(c => [c.label].concat(c.options || [])));

function bindFmComposer() {
  const L = fmLang;
  const leia = () => {
    const d = draftFm;
    d.name[L] = document.getElementById('mName').value;
    d.desc[L] = document.getElementById('mDesc').value;
    d.note[L] = document.getElementById('mNote').value;
    d.url = document.getElementById('mUrl').value;
    document.querySelectorAll('[data-rrow]').forEach(row => {
      const r = d.recipients[Number(row.dataset.rrow)];
      if (!r) return;
      r.name = row.querySelector('[data-rf="name"]').value;
      r.email = row.querySelector('[data-rf="email"]').value;
    });
    d.sector = document.getElementById('mSector').value;
    d.icon = document.getElementById('mIcon').value;
    d.minDays = Math.max(0, Math.min(60, parseInt(document.getElementById('mMinDays').value, 10) || 0));
    document.querySelectorAll('[data-frow]').forEach(row => {
      const c = d.fields[Number(row.dataset.i)];
      if (!c) return;
      c.label[L] = row.querySelector('[data-ff="label"]').value;
      c.required = row.querySelector('[data-ff="required"]').checked;
      const ex = row.querySelector('[data-ff="exempt"]');
      c.exempt = !!(ex && ex.checked);
      row.querySelectorAll('[data-fopt]').forEach(el => {
        const o = c.options[Number(el.dataset.fopt)];
        if (o) o[L] = el.value;
      });
    });
  };
  const redesenha = () => { renderComposer(); };
  const limpaErro = () => {
    const e = document.getElementById('mErr'); e.classList.add('hidden'); e.classList.remove('flex');
  };
  document.getElementById('composer').querySelectorAll('input, textarea').forEach(el =>
    el.addEventListener('input', limpaErro));

  // idioma que está sendo digitado / 入力中の言語
  document.querySelectorAll('[data-mlang]').forEach(b => b.addEventListener('click', () => {
    leia();
    fmLang = b.dataset.mlang;
    redesenha();
  }));
  const tr = document.getElementById('mTr');
  if (tr) tr.addEventListener('click', async () => {
    leia();
    if (await traduzirMl(textosDoFm(draftFm), L, tr)) redesenha();
  });

  // campos / 項目
  document.getElementById('mFieldAdd').addEventListener('click', () => {
    leia();
    draftFm.fields.push(normalizaCampo({ type: document.getElementById('mNewType').value,
      options: [mlVazio(), mlVazio()] }));
    redesenha();
  });
  document.querySelectorAll('[data-frow]').forEach(row => {
    const i = Number(row.dataset.i);
    row.querySelector('[data-ff="type"]').addEventListener('change', e => {
      leia();
      const c = draftFm.fields[i];
      c.type = e.target.value;
      if (c.type === 'choice' && c.options.length < 2) {
        while (c.options.length < 2) c.options.push(mlVazio());
      }
      draftFm.fields[i] = normalizaCampo(c);
      redesenha();
    });
    const mexe = (sel, fn) => { const b = row.querySelector(sel); if (b) b.addEventListener('click', () => { leia(); fn(); redesenha(); }); };
    mexe('[data-fup]',   () => { const f = draftFm.fields; [f[i - 1], f[i]] = [f[i], f[i - 1]]; });
    mexe('[data-fdown]', () => { const f = draftFm.fields; [f[i + 1], f[i]] = [f[i], f[i + 1]]; });
    mexe('[data-frm]',   () => { draftFm.fields.splice(i, 1); });
    mexe('[data-foptadd]', () => { draftFm.fields[i].options.push(mlVazio()); });
    row.querySelectorAll('[data-foptrm]').forEach(b => b.addEventListener('click', () => {
      leia();
      draftFm.fields[i].options.splice(Number(b.dataset.foptrm), 1);
      redesenha();
    }));
  });

  const add = document.getElementById('mMailAdd');
  if (add) add.addEventListener('click', () => {
    leia();
    if (draftFm.recipients.length < FM_MAX_EMAILS) draftFm.recipients.push(novoDest());
    redesenha();
  });
  document.querySelectorAll('[data-mailrm]').forEach(b => b.addEventListener('click', () => {
    leia();
    draftFm.recipients.splice(Number(b.dataset.mailrm), 1);
    if (!draftFm.recipients.length) draftFm.recipients = [novoDest()];
    redesenha();
  }));
  const mc = document.getElementById('mCancel');
  if (mc) mc.addEventListener('click', () => {
    editingFm = null;
    draftFm = novoFm();
    renderSection();
  });
  document.getElementById('mSave').addEventListener('click', async () => {
    leia();
    const err = document.getElementById('mErr');
    const falha = msg => { err.classList.remove('hidden'); err.classList.add('flex'); err.querySelector('span').textContent = msg; };
    const d = draftFm;

    if (!mlTem(d.name)) return falha(t().fmErrName);
    const campos = d.fields.map(c => {
      const n = normalizaCampo(c);
      n.options = n.options.filter(mlTem);
      return n;
    });
    if (campos.some(c => !mlTem(c.label))) return falha(t().fmErrLabel);
    if (campos.some(c => c.type === 'choice' && c.options.length < 2)) return falha(t().fmErrOptions);
    const ficha = d.kind === 'ficha';
    if (!campos.length && !d.modelo && (ficha || !d.url.trim())) return falha(t().fmErrNothing);
    // linhas totalmente vazias são ignoradas; as outras precisam de nome e e-mail
    // 空行は無視し、それ以外は氏名とメールが必要です
    const dests = d.recipients
      .map(r => ({ id: r.id || novoDest().id, name: String(r.name || '').trim(), email: String(r.email || '').trim() }))
      .filter(r => r.name || r.email);
    if (dests.some(r => !r.name || !emailOk(r.email))) return falha(t().fmErrRecip);
    if (dests.length > FM_MAX_EMAILS) return falha(t().fmEmailMax);
    if (!ficha && (campos.length || d.modelo) && !dests.length) return falha(t().fmErrNoMail);
    const mails = dests.map(r => r.name);   // para o histórico: só os nomes / 履歴には氏名のみ

    const limpo = {
      ...(ficha ? { kind: 'ficha', anon: false } : {}),
      ...(d.modelo ? { modelo: d.modelo } : {}),
      name: d.name, desc: d.desc, note: d.note,
      url: d.url.trim(), recipients: dests,
      sector: d.sector, icon: d.icon, minDays: d.minDays, fields: campos
    };
    const next = structuredClone(DATA);
    const col = ficha ? 'fichas' : 'forms';   // onde fica / 保存先
    if (!next[col]) next[col] = [];
    let idFm = editingFm;
    if (editingFm) {
      const i = next[col].findIndex(x => x.id === editingFm);
      next[col][i] = { ...next[col][i], ...limpo };
      delete next[col][i].emails;          // formato antigo / 旧形式
    } else {
      idFm = 'fm' + Date.now().toString(36);
      next[col].push({ id: idFm, ...limpo });
    }
    const msg = editingFm ? t().fmUpd : t().fmAdded;
    const ok = await saveContent(next, {
      acao: editingFm ? 'editado' : 'publicado', tipo: 'formulario', id: idFm,
      setor: d.sector, titulo: rotuloHist(d.name),
      detalhe: mails.join(', ')
    });
    if (!ok) return;
    editingFm = null;
    draftFm = novoFm();
    renderSection();
    toast(msg);
  });
}

/* ---------- tradução automática ----------
   Preenche só os idiomas vazios, a partir do idioma que está na tela. O que
   a administração já escreveu nunca é trocado. / 表示中の言語から、未入力の
   言語だけを埋めます。管理部門が入力済みの内容は上書きしません。 */
async function traduzirMl(lista, de, botao) {
  if (!CONECTADO) { toast(t().trOffline, 4000); return false; }
  const alvos = lista.filter(v => v && typeof v === 'object' && (v[de] || '').trim());
  if (!alvos.length) { toast(fmt(t().trNothing, { l: LANG_NAME[de] }), 3500); return false; }
  const para = LANGS.filter(l => l !== de && alvos.some(v => !(v[l] || '').trim()));
  if (!para.length) { toast(t().trAllFull); return false; }
  if (botao) { botao.disabled = true; botao.textContent = t().trWorking; }
  try {
    const r = await servidorEd('traduzirCampos', alvos.map(v => v[de]), de, para);
    alvos.forEach((v, i) => para.forEach(l => {
      if (!(v[l] || '').trim() && r && r[l] && r[l][i]) v[l] = r[l][i];
    }));
    toast(t().trDone, 6000);
    return true;
  } catch (e) {
    toast(e.message, 5000);
    if (botao) { botao.disabled = false; botao.textContent = fmt(t().trBtn, { l: LANG_NAME[de] }); }
    return false;
  }
}

   O funcionário preenche aqui, o PDF é montado no próprio aparelho e o
   servidor manda por e-mail para os destinatários do formulário.
   As respostas não ficam guardadas em lugar nenhum além do PDF.
   従業員がここで記入し、PDFは端末上で作成、サーバーがフォームの送信先へ

let envio = null;   // preenchimento em andamento / 記入中のデータ
const novoEnvio = f => ({ formId: f.id, code: USUARIO || '', anon: false, destino: '', values: {}, photos: {}, done: null, pdfUrl: '', fileName: '', sending: false });

const hoje0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const lerData = s => {
  const p = String(s || '').split('-').map(Number);
  if (p.length !== 3 || !p[0] || !p[1] || !p[2]) return null;
  const d = new Date(p[0], p[1] - 1, p[2]); d.setHours(0, 0, 0, 0);
  return d;
};
const dataBr = d => d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
const diasEntre = (a, b) => Math.round((b - a) / 86400000);

function campoFill(c) {
  const v = envio.values[c.id];
  const rot = `${esc(txt(c.label))}${c.required ? ' <span class="text-red-600">*</span>' : ''}`;
  const lab = `<label for="v_${c.id}" class="mb-1.5 block text-[14px] font-semibold text-ink">${rot}</label>`;
  switch (c.type) {
    case 'textarea':
      return `<div>${lab}<textarea id="v_${c.id}" data-v="${c.id}" rows="3" maxlength="1000" class="field">${esc(v || '')}</textarea></div>`;
    case 'number':
      return `<div>${lab}<input id="v_${c.id}" data-v="${c.id}" type="number" inputmode="decimal" class="field sm:max-w-[200px]" value="${esc(v || '')}"></div>`;
    case 'date':
      return `<div>${lab}<input id="v_${c.id}" data-v="${c.id}" type="date" class="field sm:max-w-[220px]" value="${esc(v || '')}"></div>`;
    case 'period': {
      const p = v || {};
      return `<div>${lab}
        <div class="flex flex-wrap items-end gap-3">
          <div><span class="mb-1 block text-[13px] text-slate-500">${t().fmStart}</span>
            <input id="v_${c.id}" data-v="${c.id}" data-p="a" type="date" class="field w-[190px]" value="${esc(p.a || '')}"></div>
          <div><span class="mb-1 block text-[13px] text-slate-500">${t().fmEnd}</span>
            <input data-v="${c.id}" data-p="b" type="date" class="field w-[190px]" value="${esc(p.b || '')}"></div>
          <p id="dias_${c.id}" class="min-h-[44px] content-center text-[14px] font-semibold text-leafdark"></p>
        </div></div>`;
    }
    case 'choice':
      return `<div>${lab}<select id="v_${c.id}" data-v="${c.id}" class="field sm:max-w-[360px]">
          <option value="">${t().fmChoose}</option>
          ${c.options.map((o, j) => `<option value="${j}"${String(v) === String(j) ? ' selected' : ''}>${esc(txt(o))}</option>`).join('')}
        </select></div>`;
    case 'check':
      return `<label class="flex w-fit min-h-[44px] items-center gap-2.5 text-[15px] text-ink">
          <input type="checkbox" data-v="${c.id}" class="h-5 w-5 accent-[#2A4A9E]"${v ? ' checked' : ''}>
          <span>${rot}</span></label>`;
    case 'photo': {
      const foto = envio.photos[c.id];
      return `<div><p class="mb-1.5 text-[14px] font-semibold text-ink">${rot}</p>
        ${foto ? `
          <div class="flex flex-wrap items-center gap-3">
            <img src="${foto}" alt="" class="h-24 w-24 rounded-xl border border-line object-cover">

    }
    default:
      return `<div>${lab}<input id="v_${c.id}" data-v="${c.id}" maxlength="200" class="field" value="${esc(v || '')}"></div>`;
  }

  if (!fmTemCampos(f)) {
    return voltar + `<div class="rounded-2xl border border-dashed border-line bg-white px-6 py-14 text-center text-[15px] text-slate-400">${t().fmNotReady}</div>`;
  }

  return voltar + `

      ${mlTem(f.desc) ? `<p class="max-w-[62ch] text-[15px] leading-relaxed text-slate-500">${esc(txt(f.desc))}</p>` : ''}
      ${mlTem(f.note) ? `
        <p class="mt-3 flex items-start gap-2 rounded-xl bg-ambersoft px-4 py-3 text-[14px] font-semibold leading-relaxed text-amberdark">
          <i data-lucide="triangle-alert" class="mt-0.5 h-4 w-4 shrink-0"></i>${esc(txt(f.note))}</p>` : ''}

      <div class="mt-5 grid gap-5">
        ${USUARIO ? cartaoIdentidade('vCode', 'vWho', USUARIO) : `<div>
          <label for="vCode" class="mb-1.5 block text-[14px] font-semibold text-ink">${t().fbCode} <span class="text-red-600">*</span></label>
          <input id="vCode" class="field sm:max-w-[260px]" autocomplete="off" value="${esc(e.code)}">
          <p id="vWho" class="mt-1.5 text-[13px]"></p>
        </div>`}
        ${f.modelo ? '' : f.fields.map(campoFill).join('')}
      </div>
      ${f.modelo ? areaModelo(f) : ''}
      ${ficha ? '' : escolhaDestino(f)}

      <p id="vErr" class="mt-4 hidden items-center gap-2 rounded-lg bg-red-50 px-3 py-2.5 text-[14px] font-medium text-red-700">
        <i data-lucide="circle-alert" class="h-4 w-4 shrink-0"></i><span></span>
      </p>
      <div class="mt-5 flex justify-end">
        <button type="button" id="vSend" class="inline-flex min-h-[48px] items-center gap-2 rounded-lg bg-ink px-5 text-[15px] font-semibold text-white hover:bg-ink2 disabled:opacity-60"${e.sending ? ' disabled' : ''}>
          <i data-lucide="send" class="h-4 w-4"></i>${e.sending ? t().fmSending : (ficha ? t().fcSend : t().fmSendBtn)}
        </button>
      </div>
      <p class="mt-4 flex items-start gap-2 border-t border-line pt-4 text-[13px] leading-relaxed text-slate-500">
        <i data-lucide="lock" class="mt-0.5 h-4 w-4 shrink-0 text-brand"></i>${ficha ? t().fbNotPublic : t().fmPrivacy}
      </p>
    </div>`;
}

/* Lê a tela para dentro de envio, sem redesenhar. / 画面の入力内容を envio に読み込みます。 */
function leiaEnvio() {
  const code = document.getElementById('vCode');
  if (code && !code.disabled) envio.code = code.value;
  envio.anon = false;                    // envio sempre identificado / 常に記名
  document.querySelectorAll('[data-mv]').forEach(el => { envio.values[el.dataset.mv] = el.value; });
  document.querySelectorAll('[data-v]').forEach(el => {
    const id = el.dataset.v;
    if (el.dataset.p) {
      envio.values[id] = { ...(envio.values[id] || {}), [el.dataset.p]: el.value };
    } else if (el.type === 'checkbox') {
      envio.values[id] = el.checked;
    } else {
      envio.values[id] = el.value;
    }
  });
}

function bindFmFill(f) {
  const agn = document.getElementById('fmAgain');
  if (agn) agn.addEventListener('click', () => { envio = novoEnvio(f); renderSection(); });
  const ed = document.getElementById('fmEditHere');
  document.querySelectorAll('[data-dest]').forEach(b => b.addEventListener('click', () => {
    leiaEnvio();
    envio.destino = b.dataset.dest;
    renderSection();
  }));
  if (ed) ed.addEventListener('click', () => {
    editingFm = f.id;
    draftFm = rascunhoDoFm(f);
    renderSection();
    document.getElementById('composer').scrollIntoView({ behavior:'smooth', block:'start' });
  });
  if (!document.getElementById('vSend')) return;

  const erro = msg => {
    const el = document.getElementById('vErr');
    el.classList.remove('hidden'); el.classList.add('flex');
    el.querySelector('span').textContent = msg;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  const limpaErro = () => {
    const el = document.getElementById('vErr'); el.classList.add('hidden'); el.classList.remove('flex');
  };

  // nome e setor aparecem assim que o código bate com o cadastro
  const quem = () => {
    const el = document.getElementById('vWho');
    const code = document.getElementById('vCode').value.trim();
    if (!code) { el.textContent = ''; el.className = 'mt-1.5 text-[13px]'; return; }
    const p = empByCode(code);
    // com o cartão de identidade, a linha fica escondida / 本人カード表示中は非表示
    el.className = 'mt-1.5 text-[13px] ' + (p ? 'font-semibold text-leafdark' : 'text-amberdark') + (USUARIO ? ' hidden' : '');
    el.textContent = p ? nomePessoa(p) + ' · ' + sectorLabel(p.sector) : t().fbCodeNotFound;
    if (f.modelo) {                        // código e nome vão para a folha / 原紙に社員コードと氏名
      autosDoModelo(f, p);
      document.querySelectorAll('[data-mauto="codigo"],[data-mauto="nome"]').forEach(s => { s.textContent = envio.values[s.dataset.mid] || ''; });
    }
  };
  // total de dias dos períodos / 期間の日数
  const dias = () => f.fields.filter(c => c.type === 'period').forEach(c => {
    const el = document.getElementById('dias_' + c.id);
    const a = lerData(document.querySelector(`[data-v="${c.id}"][data-p="a"]`).value);
    const b = lerData(document.querySelector(`[data-v="${c.id}"][data-p="b"]`).value);
    el.textContent = a && b && b >= a ? fmt(t().fmDays, { n: diasEntre(a, b) + 1 }) : '';
  });
  quem(); dias();
  if (f.modelo) bindModelo(f);          // folha original / 原紙

  document.getElementById('vCode').addEventListener('input', () => { limpaErro(); quem(); });
  document.querySelectorAll('[data-v]').forEach(el => {
    el.addEventListener('input', limpaErro);
    el.addEventListener('change', limpaErro);
  });
  // um dia só: o fim acompanha o início enquanto estiver vazio
  // 1日だけの場合：終了日が空なら開始日に合わせます
  document.querySelectorAll('[data-p="a"]').forEach(el => el.addEventListener('change', () => {
    const fim = document.querySelector(`[data-v="${el.dataset.v}"][data-p="b"]`);
    if (fim && !fim.value) fim.value = el.value;
    dias();
  }));
  document.querySelectorAll('[data-p="b"]').forEach(el => el.addEventListener('change', dias));

  // foto: reduzida no aparelho antes de entrar no PDF / 写真は端末で縮小してからPDFへ
  document.querySelectorAll('[data-photo]').forEach(inp => inp.addEventListener('change', ev => {
    const file = ev.target.files[0];
    if (!file) return;
    leiaEnvio();
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        const escala = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * escala);
        cv.height = Math.round(img.height * escala);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        envio.photos[inp.dataset.photo] = cv.toDataURL('image/jpeg', 0.8);
        renderSection();
      };
      img.onerror = () => erro(t().fbPhotoBig);
      img.src = leitor.result;
    };
    leitor.readAsDataURL(file);
  }));
  document.querySelectorAll('[data-photorm]').forEach(b => b.addEventListener('click', () => {
    leiaEnvio();
    delete envio.photos[b.dataset.photorm];
    renderSection();
  }));

  document.getElementById('vSend').addEventListener('click', async () => {
    if (envio.sending) return;                 // toque duplo / 二重送信防止
    leiaEnvio();
    const problema = conferirEnvio(f);
    if (problema) return erro(problema);

    // guarda o envio desta tela: se a pessoa trocar de página no meio, nada quebra
    // この画面の送信内容を保持（途中で画面を移動してもエラーにしない）
    const env = envio;
    const aindaAqui = () => envio === env && section === 'form:' + f.id;
    const para = nomeDoDestino(f);
    env.sending = true;
    const b = document.getElementById('vSend');
    b.disabled = true; b.textContent = t().fmSending;
    try {
      if (ehFicha(f)) {                       // ficha: vai para o feedback, sem PDF / シート：PDFなしでフィードバックへ
        await enviarFichaAgora(f);
        env.sending = false;
        toast(t().fbOkTitle, 4000);
        if (aindaAqui()) { renderSection(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        return;
      }
      const pessoa = empByCode(env.code);
      const pdf = await montarPdf(f, pessoa);
      if (CONECTADO) {
        const r = await servidor('enviarFormulario', f.id, {
          codigo: pessoa.code, destino: env.destino, pdf: pdf.base64, arquivo: pdf.nome
        });
        env.done = { protocolo: r.protocolo, para };
      } else {
        env.done = { demo: true };
      }
      env.pdfUrl = URL.createObjectURL(pdf.blob);
      env.fileName = pdf.nome;
      env.sending = false;
      toast(t().fmOkTitle, 4000);
      if (aindaAqui()) { renderSection(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    } catch (e) {
      env.sending = false;
      const msg = e && e.message ? e.message : t().fmErrPdf;
      if (!aindaAqui()) return toast(msg, 5000);
      const bt = document.getElementById('vSend');
      if (bt) { bt.disabled = false; bt.textContent = ehFicha(f) ? t().fcSend : t().fmSendBtn; }
      erro(msg);
    }
  });
}

/* Rascunho de edição a partir de um formulário ou ficha salvos.
   保存済みのフォーム／シートから編集用の下書きを作ります。 */
function rascunhoDoFm(f) {
  const dests = structuredClone(destinatariosDe(f));
  return { kind: f.kind || '', anon: !!f.anon, modelo: f.modelo || '',
           name: paraMl(f.name), desc: paraMl(f.desc), note: paraMl(f.note),
           url: f.url || '', recipients: dests.length ? dests : [novoDest()],
           sector: f.sector || 'all', icon: f.icon || 'file-text',
           minDays: Number(f.minDays) || 0,
           fields: structuredClone(f.fields || []).map(normalizaCampo) };
}

/* Resposta de um campo em texto, em português e japonês, para a planilha.
   シート保存用に、回答をポルトガル語・日本語の文字列にします。 */
function valorTexto(c) {
  const v = envio.values[c.id];
  switch (c.type) {
    case 'period': {
      const a = lerData(v && v.a), b = lerData(v && v.b);
      if (!a || !b) return '';
      const n = diasEntre(a, b) + 1;
      return `${dataBr(a)} 〜 ${dataBr(b)} (${n} dia(s) / ${n}日)`;
    }
    case 'date': { const d = lerData(v); return d ? dataBr(d) : ''; }
    case 'choice': {
      const o = c.options[Number(v)];
      if (v === '' || v == null || !o) return '';
      const m = paraMl(o), ja = (m.ja || '').trim(), pt = (m.pt || '').trim();
      return ja && pt && ja !== pt ? pt + ' / ' + ja : (pt || ja || txt(o));
    }
    case 'check': return v ? 'Sim / はい' : 'Não / いいえ';
    case 'photo': return envio.photos[c.id] ? 'foto anexada / 写真あり' : '';
    default: return String(v == null ? '' : v).trim();
  }
}

/* Ficha do feedback: as respostas vão para a planilha do feedback, e a
   administração e os líderes veem em "Feedback interno".
   シート：回答はフィードバックのシートに保存され、管理部門とリーダーが確認します。 */
/** Nome do destinatário escolhido. / 選ばれた送信先の氏名。 */
function nomeDoDestino(f) {
  const ds = destinatariosDe(f);
  const i = envio ? ds.findIndex(r => r.id === envio.destino) : -1;
  return i >= 0 ? nomeDest(ds[i], i) : '';
}

async function enviarFichaAgora(f) {
  const env = envio;                      // referência própria (ver o envio) / 送信時点の参照
  const pessoa = env.anon ? null : empByCode(env.code);
  const respostas = f.fields.map(c => {
    const m = paraMl(c.label);
    return { pt: (m.pt || '').trim() || txt(c.label), ja: (m.ja || '').trim(), valor: valorTexto(c),
             livre: c.type === 'text' || c.type === 'textarea' };   // traduz para o japonês / 日本語訳の対象
  });
  const fotos = f.fields.filter(c => c.type === 'photo' && env.photos[c.id]).map(c => env.photos[c.id]);
  if (CONECTADO) {
    const r = await servidor('enviarFicha', f.id, {
      codigo: pessoa ? pessoa.code : '', anonimo: env.anon, setor: activeSector || '',
      respostas, fotos
    });
    env.done = { protocolo: r.protocolo };
  } else {
    DATA.feedback.unshift({
      id: 'f' + Date.now().toString(36), sector: pessoa ? pessoa.sector : (activeSector || ''),
      area: 0, anonymous: env.anon, author: pessoa ? pessoa.code : '',
      message: (respostas.find(r => r.valor.trim()) || {}).valor || '',
      photos: fotos, em: new Date().toISOString(), status: 'new', reply: '',
      kind: f.id, kindName: txt(f.name), answers: respostas
    });
    env.done = { demo: true };
  }
  fbCarregado = false;                   // a lista da administração recarrega / 一覧を再読み込み
}

/* Confere o preenchimento. Devolve a mensagem de erro, ou '' se estiver certo.
   入力内容を確認し、問題があればメッセージを返します。 */
function conferirEnvio(f) {
  if (!envio.code.trim()) return t().fmErrCode;
  if (!empByCode(envio.code)) return t().fbCodeNotFound;
  if (!ehFicha(f) && destinatariosDe(f).length && !destinatariosDe(f).some(r => r.id === envio.destino)) {
    return t().fmErrDest;
  }

  const dispensa = f.fields.some(c => c.type === 'check' && c.exempt && envio.values[c.id]);
  for (const c of f.fields) {
    const v = envio.values[c.id];
    const nome = txt(c.label);
    if (c.type === 'period') {
      const a = lerData(v && v.a), b = lerData(v && v.b);
      if ((a || b) && !(a && b)) return fmt(t().fmErrReq, { f: nome });
      if (c.required && !(a && b)) return fmt(t().fmErrReq, { f: nome });
      if (a && b && b < a) return t().fmErrPeriod;
    } else if (c.type === 'photo') {
      // quem usa a caixa que dispensa a antecedência precisa mandar a foto
      // 期限の例外を使う場合は写真が必要です
      if ((c.required || dispensa) && !envio.photos[c.id]) return fmt(t().fmErrReq, { f: nome });
    } else if (c.type === 'check') {
      if (c.required && !v) return fmt(t().fmErrReq, { f: nome });
    } else if (c.required && !String(v == null ? '' : v).trim()) {
      return fmt(t().fmErrReq, { f: nome });
    }
  }

  // folha original: campos obrigatórios e a regra própria de cada folha
  // 原紙：必須項目と各原紙のチェック
  if (f.modelo && MODELOS[f.modelo]) {
    const m = MODELOS[f.modelo], v = envio.values;
    for (const c of m.campos) {
      if (!c.req) continue;
      const vazio = c.tipo === 'radio' ? !v[c.grupo] : c.tipo === 'sign' ? !envio.photos[c.id] : !String(v[c.id] || '').trim();
      if (vazio) return fmt(t().fmErrReq, { f: txt(c.rot) });
    }
    if (m.validar) { const p = m.validar(v); if (p) return p; }
  }

  // antecedência mínima: conta a partir da primeira data do formulário
  // 最低申請日数：フォーム内の最初の日付で判定します
  const minimo = Number(f.minDays) || 0;
  if (minimo > 0 && !dispensa) {
    const primeira = f.fields.find(c => c.type === 'date' || c.type === 'period');
    if (primeira) {
      const v = envio.values[primeira.id];
      const d = lerData(primeira.type === 'period' ? v && v.a : v);
      if (d && diasEntre(hoje0(), d) < minimo) return fmt(t().fmErrMinDays, { n: minimo });
    }
  }
  return '';
}

/* Imagens das folhas: vêm do arquivo "modelos" só quando alguém abre o
   formulário. / 原紙画像は、フォームを開いたときだけ「modelos」から読み込みます。 */
const MDL_IMG = {};
async function carregarModelo(id) {
  if (MDL_IMG[id]) return MDL_IMG[id];
  if (CONECTADO) {
    MDL_IMG[id] = await servidor('modeloImagem', id);
  } else {
    const html = await fetch('modelos.html').then(r => r.text());
    const m = /<script[^>]*id="modelos"[^>]*>([\s\S]*?)<\/script>/.exec(html);
    Object.assign(MDL_IMG, JSON.parse(m[1]));
  }
  if (!MDL_IMG[id]) throw new Error(t().mdlErrLoad);
  return MDL_IMG[id];
}

/* Preenche o que vem sozinho: data de hoje, código e nome do cadastro.
   自動入力：今日の日付、登録の社員コードと氏名。 */
function autosDoModelo(f, pessoa) {
  const m = MODELOS[f.modelo];
  if (!m) return;
  const d = new Date();
  const hoje = { ano: String(d.getFullYear()), mes: String(d.getMonth() + 1), dia: String(d.getDate()) };
  m.campos.forEach(c => {
    if (!c.auto) return;
    if (c.auto in hoje) { if (!envio.values[c.id]) envio.values[c.id] = hoje[c.auto]; }
    else if (c.auto === 'codigo') envio.values[c.id] = pessoa ? pessoa.code : '';
    else if (c.auto === 'nome') envio.values[c.id] = pessoa ? nomeDuplo(pessoa) : '';
  });
}

const alinhar = al => al === 'center' ? 'center' : al === 'right' ? 'flex-end' : 'flex-start';

/** A folha com os campos. modo 'edit' (preencher) ou 'pdf'. / 記入用またはPDF用の原紙。 */
function folhaModelo(mid, modo, W) {
  const m = MODELOS[mid];
  const [gx, gy] = m.grade;
  const k = W / gx, H = W * gy / gx;
  const v = envio.values;
  const px = n => (n * k).toFixed(2) + 'px';
  const campos = m.campos.map(c => {
    const st = `left:${px(c.x)};top:${px(c.y)};width:${px(c.w)};height:${px(c.h)};font-size:${px(c.fs || 18)};`;
    const rot = c.rot ? esc(txt(c.rot)) : '';
    // o gerador de PDF desenha o texto um pouco abaixo do centro; sobe um pouco
    // PDF作成時は文字が下にずれるため、少し上げます
    const sobe = modo === 'pdf' ? `transform:translateY(${px(-0.32 * (c.fs || 18))});` : '';
    if (c.tipo === 'radio') {
      const on = v[c.grupo] === c.valor;
      return modo === 'edit'
        ? `<button type="button" class="mdl-x" data-mx="${c.id}" style="${st}" role="radio" aria-checked="${on}" aria-label="${rot}">${on ? '✔' : ''}</button>`
        : `<span class="mdl-t" style="${st}${sobe}justify-content:center;font-weight:700">${on ? '✔' : ''}</span>`;
    }
    if (c.tipo === 'sign') {
      const src = envio.photos[c.id];
      if (modo === 'edit') return `<button type="button" class="mdl-sign" data-sign="${c.id}" style="${st}" aria-label="${rot}">${src
        ? `<img src="${src}" alt="">` : `<span>${esc(t().mdlSign)}</span>`}</button>`;
      return src ? `<img src="${src}" alt="" style="position:absolute;${st}object-fit:contain">` : '';
    }
    const bruto = c.copia ? v[c.copia] : v[c.id];
    // ienes com separador de milhar na folha: 150000 → 150,000 / 金額は3桁区切り
    const val = modo === 'pdf' && c.milhar && /^\d+$/.test(String(bruto || '')) ? Number(bruto).toLocaleString('ja-JP') : bruto;
    if (modo === 'edit' && !c.ro && !c.copia) {
      return `<input class="mdl-i" data-mv="${c.id}" style="${st}text-align:${c.al || 'left'}" value="${esc(val || '')}"`
        + `${c.num ? ' inputmode="numeric"' : ''} maxlength="${c.max || 40}" autocomplete="off" aria-label="${rot}">`;
    }
    return `<span class="mdl-t" data-mauto="${c.auto || ''}" data-mid="${c.id}" style="${st}${sobe}justify-content:${alinhar(c.al)}">${esc(val || '')}</span>`;
  }).join('');
  // fundo como <img>: o gerador de PDF desenha <img> com segurança / 背景は<img>で描画
  return `<div class="mdl" style="width:${W}px;height:${H.toFixed(1)}px"><img class="mdl-bg" src="${MDL_IMG[mid] || ''}" alt="" style="position:absolute;left:0;top:0;width:100%;height:100%">${campos}</div>`;
}

/** Largura de desenho da folha na tela. / 画面上の原紙の幅。 */
const larguraEdicao = mid => MODELOS[mid].slot ? 700 : A4_W;

/* Encaixa a folha na largura da tela (celular) sem mudar as posições.
   原紙を画面幅に合わせて縮小します（位置は変わりません）。 */
let mdlZoom = false;                    // folha em tamanho real (celular) / 原寸表示（スマホ用）
function encaixarModelos() {
  document.querySelectorAll('.mdl-wrap').forEach(w => {
    const dentro = w.firstElementChild;
    const W = Number(w.dataset.w), H = Number(w.dataset.h);
    w.style.overflowX = mdlZoom ? 'auto' : 'hidden';
    const s = mdlZoom ? 1 : Math.min(1, w.clientWidth / W);
    dentro.style.transform = `scale(${s})`;
    w.style.height = (H * s) + 'px';
  });
}
window.addEventListener('resize', encaixarModelos);

/** Área de preenchimento: a própria folha. / 記入欄（原紙そのもの）。 */
function areaModelo(f) {
  const mid = f.modelo;
  if (!MDL_IMG[mid]) {
    carregarModelo(mid).then(() => { if (section === 'form:' + f.id) { leiaEnvio(); renderSection(); } })
      .catch(e => { const el = document.getElementById('mdlBox'); if (el) el.textContent = e.message || t().mdlErrLoad; });
    return `<div id="mdlBox" class="mt-5 rounded-xl border border-dashed border-line px-4 py-10 text-center text-[14px] text-slate-400">${t().mdlLoading}</div>`;
  }
  const m = MODELOS[mid], W = larguraEdicao(mid), H = W * m.grade[1] / m.grade[0];
  return `
    <p class="mt-5 flex items-start gap-2 text-[13px] leading-relaxed text-slate-500">
      <i data-lucide="hand" class="mt-0.5 h-4 w-4 shrink-0 text-brand"></i>${t().mdlHint}</p>
    <button type="button" id="mdlZoom" class="mt-2 inline-flex min-h-[40px] items-center gap-1.5 rounded-lg border border-line bg-white px-3 text-[13px] font-semibold text-brand hover:bg-brandsoft sm:hidden">
      <i data-lucide="${mdlZoom ? 'zoom-out' : 'zoom-in'}" class="h-4 w-4"></i>${mdlZoom ? t().mdlZoomOut : t().mdlZoomIn}</button>
    <div class="mdl-wrap mt-3 overflow-hidden rounded-lg border border-line shadow-sm" data-w="${W}" data-h="${H}">
      <div style="transform-origin:0 0;width:${W}px">${folhaModelo(mid, 'edit', W)}</div>
    </div>`;
}

/** Página A4 do PDF. / PDF用のA4ページ。 */
function paginaModelo(f) {
  const m = MODELOS[f.modelo];
  if (!m.slot) return folhaModelo(f.modelo, 'pdf', A4_W);
  const W = A4_W * m.slot.width / 100;
  return `<div style="position:relative;width:${A4_W}px;height:${A4_H}px;background:#fff">
      <div style="position:absolute;left:${m.slot.left}%;top:${m.slot.top}%">${folhaModelo(f.modelo, 'pdf', W)}</div>
    </div>`;
}

/* Texto comprido diminui até caber no espaço da folha (nome com katakana, p.ex.).
   長い文字は枠に収まるまで縮小します。 */
function ajustarTextos(raiz) {
  raiz.querySelectorAll('.mdl-t').forEach(el => {
    let fs = parseFloat(el.style.fontSize) || 16;
    while (el.scrollWidth > el.clientWidth && fs > 6) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
  });
}

function bindModelo(f) {
  const box = document.querySelector('.mdl-wrap');
  if (!box) return;
  encaixarModelos();
  const zb = document.getElementById('mdlZoom');
  if (zb) zb.addEventListener('click', () => { leiaEnvio(); mdlZoom = !mdlZoom; renderSection(); });
  box.querySelectorAll('[data-mv]').forEach(el => el.addEventListener('input', () => {
    if (el.inputMode === 'numeric') el.value = el.value.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/[^\d]/g, '');
    envio.values[el.dataset.mv] = el.value;
    const copia = box.querySelectorAll(`[data-mid]`);
    copia.forEach(s => { const c = MODELOS[f.modelo].campos.find(x => x.id === s.dataset.mid); if (c && c.copia === el.dataset.mv) s.textContent = el.value; });
    const e = document.getElementById('vErr'); if (e) { e.classList.add('hidden'); e.classList.remove('flex'); }
  }));
  box.querySelectorAll('[data-mx]').forEach(b => b.addEventListener('click', () => {
    const c = MODELOS[f.modelo].campos.find(x => x.id === b.dataset.mx);
    leiaEnvio();
    envio.values[c.grupo] = c.valor;
    renderSection();
  }));
  box.querySelectorAll('[data-sign]').forEach(b => b.addEventListener('click', () => { leiaEnvio(); abrirAssinatura(b.dataset.sign); }));
}

/* Assinatura com o dedo, num quadro grande; depois vai para o espaço 署名.
   大きな枠に指で署名し、署名欄に配置します。 */
function abrirAssinatura(id) {
  const w = document.createElement('div');
  w.id = 'signWrap';
  w.className = 'fixed inset-0 z-[85] flex items-end justify-center bg-ink/50 sm:items-center sm:p-6';
  w.innerHTML = `
    <div class="w-full max-w-lg rounded-t-2xl bg-white p-5 shadow-xl sm:rounded-2xl" role="dialog" aria-modal="true" aria-labelledby="sgT">
      <h2 id="sgT" class="font-head text-lg font-bold text-ink">${t().mdlSignTitle}</h2>
      <p class="mt-1 text-[13px] text-slate-500">${t().mdlSignHelp}</p>
      <canvas id="sgCv" width="720" height="240" class="mt-3 w-full rounded-xl border-2 border-dashed border-line bg-white" style="touch-action:none"></canvas>
      <p id="sgErr" class="mt-2 hidden text-[13px] font-medium text-red-700"></p>
      <div class="mt-4 flex flex-wrap justify-end gap-2">
        <button type="button" id="sgClear" class="min-h-[44px] rounded-lg border border-line px-4 text-sm font-semibold text-slate-600 hover:bg-slate-50">${t().mdlSignClear}</button>
        <button type="button" id="sgCancel" class="min-h-[44px] rounded-lg border border-line px-4 text-sm font-semibold text-slate-600 hover:bg-slate-50">${t().nCancel}</button>
        <button type="button" id="sgOk" class="min-h-[44px] rounded-lg bg-ink px-4 text-sm font-semibold text-white hover:bg-ink2">${t().mdlSignOk}</button>
      </div>
    </div>`;
  document.body.appendChild(w);
  const cv = document.getElementById('sgCv'), ctx = cv.getContext('2d');
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  let desenhando = false, riscou = false;
  const ponto = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', e => { desenhando = true; riscou = true; cv.setPointerCapture(e.pointerId); const [x, y] = ponto(e); ctx.beginPath(); ctx.moveTo(x, y); });
  cv.addEventListener('pointermove', e => { if (!desenhando) return; const [x, y] = ponto(e); ctx.lineTo(x, y); ctx.stroke(); });
  cv.addEventListener('pointerup', () => { desenhando = false; });
  const fechar = () => w.remove();
  document.getElementById('sgClear').addEventListener('click', () => { ctx.clearRect(0, 0, cv.width, cv.height); riscou = false; });
  document.getElementById('sgCancel').addEventListener('click', fechar);
  document.getElementById('sgOk').addEventListener('click', () => {
    if (!riscou) { const e = document.getElementById('sgErr'); e.textContent = t().mdlSignEmpty; e.classList.remove('hidden'); return; }
    envio.photos[id] = cv.toDataURL('image/png');
    fechar();
    renderSection();
  });
}

/* ---------- PDF ----------
   Montado no aparelho, como no gerador de 有給 que já está em uso: a folha é
   desenhada em HTML, fotografada pelo html2canvas e colocada num A4 pelo jsPDF.
   Assim o japonês sai certo sem depender de fonte no servidor.
   既存の有給申請ツールと同じく端末上で作成します。HTMLで用紙を描き、
   html2canvas で画像化して jsPDF でA4にします。日本語もそのまま出ます。 */
const LIB_H2C   = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
const LIB_JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

function carregarScript(src) {
  return new Promise((ok, falha) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = ok;
    s.onerror = () => falha(new Error(t().fmErrLib));
    document.head.appendChild(s);
  });
}
async function bibliotecasPdf() {
  if (!window.html2canvas) await carregarScript(LIB_H2C);
  if (!(window.jspdf && window.jspdf.jsPDF)) await carregarScript(LIB_JSPDF);
}

/* Rótulo do PDF: japonês grande e português pequeno, os idiomas de quem recebe.
   PDFの見出し：日本語を大きく、ポルトガル語を小さく（受け取る側の言語）。 */
function duplo(v, jaFixo, ptFixo) {
  let ja = jaFixo, pt = ptFixo;
  if (v != null) {
    const m = paraMl(v);
    ja = (m.ja || '').trim(); pt = (m.pt || '').trim();
    if (!ja && !pt) ja = txt(v);
    if (!ja) { ja = pt; pt = ''; }
    if (ja === pt) pt = '';
  }
  return `<div style="font-size:14px;font-weight:700;line-height:1.3">${esc(ja)}</div>`
    + (pt ? `<div style="font-size:10.5px;color:#333;line-height:1.3;margin-top:2px">${esc(pt)}</div>` : '');
}

function valorPdf(c) {
  const v = envio.values[c.id];
  const nada = '<span style="color:#999">—</span>';
  switch (c.type) {
    case 'period': {
      const a = lerData(v && v.a), b = lerData(v && v.b);
      if (!a || !b) return nada;
      const n = diasEntre(a, b) + 1;
      return `${dataBr(a)} 〜 ${dataBr(b)}　<b>計 ${n} 日 / ${n} DIA(S)</b>`;
    }
    case 'date': { const d = lerData(v); return d ? dataBr(d) : nada; }
    case 'choice': {
      const o = c.options[Number(v)];
      if (v === '' || v == null || !o) return nada;
      const m = paraMl(o), ja = (m.ja || '').trim(), pt = (m.pt || '').trim();
      return esc(ja && pt && ja !== pt ? ja + ' / ' + pt : (ja || pt || txt(o)));
    }
    case 'check':
      return v ? '<b>☑ 該当する / SIM</b>' : '☐ 該当しない / NÃO';
    case 'photo':
      return envio.photos[c.id] ? '添付写真あり（別ページ）/ Foto anexada (página seguinte)' : nada;
    default: {
      const s = String(v == null ? '' : v).trim();
      return s ? `<span style="white-space:pre-wrap">${esc(s)}</span>` : nada;
    }
  }
}

function folhaPdf(f, pessoa) {
  const linha = (rot, val) => `
    <div style="display:flex;gap:16px;border-bottom:1px solid #000;padding:12px 4px">
      <div style="width:170px;flex-shrink:0">${rot}</div>
      <div style="flex:1;font-size:14px;line-height:1.55;word-break:break-word">${val}</div>
    </div>`;
  const nomeF = paraMl(f.name);
  const titJa = (nomeF.ja || '').trim() || txt(f.name);
  const titPt = (nomeF.pt || '').trim();
  const nota = paraMl(f.note);
  const notaJa = (nota.ja || '').trim(), notaPt = (nota.pt || '').trim();

  return `
    <div style="width:794px;min-height:1123px;padding:30px;box-sizing:border-box;background:#fff;color:#000;
                font-family:'Noto Sans JP','Yu Gothic','Meiryo',Manrope,sans-serif">
      <div style="border:1.5px solid #000;min-height:1063px;padding:22px 26px;box-sizing:border-box">
        <div style="display:flex;gap:14px;margin-bottom:14px">
          <div style="flex:1.35;border:1.5px solid #000;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px 10px;text-align:center">
            <div style="font-size:24px;font-weight:700;letter-spacing:3px">${esc(titJa)}</div>
            ${titPt && titPt !== titJa ? `<div style="font-size:18px;margin-top:6px">${esc(titPt.toUpperCase())}</div>` : ''}

async function montarPdf(f, pessoa) {
  try { await bibliotecasPdf(); } catch (e) { throw new Error(t().fmErrLib); }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const W = 210, H = 297;

  const palco = document.createElement('div');
  palco.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;z-index:-1';
  document.body.appendChild(palco);
  let paginas = 0;
  const fotografa = async html => {
    palco.innerHTML = html;
    ajustarTextos(palco);                // texto comprido cabe no espaço / 長い文字を縮小
    const imgs = Array.from(palco.querySelectorAll('img'));
    await Promise.all(imgs.map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
    const cv = await html2canvas(palco.firstElementChild, { scale: 2, backgroundColor: '#ffffff' });
    // folha mais comprida que um A4 é cortada em páginas / A4を超える場合は分割
    const alturaPag = Math.round(cv.width * H / W);
    for (let y = 0; y < cv.height; y += alturaPag) {
      const pedaco = document.createElement('canvas');
      pedaco.width = cv.width;
      pedaco.height = Math.min(alturaPag, cv.height - y);
      const ctx = pedaco.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pedaco.width, pedaco.height);
      ctx.drawImage(cv, 0, -y);
      if (paginas++) pdf.addPage();
      pdf.addImage(pedaco.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, W, pedaco.height * W / cv.width);
    }
  };

  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    if (f.modelo) await carregarModelo(f.modelo);
    await fotografa(f.modelo ? paginaModelo(f) : folhaPdf(f, pessoa));
    for (const c of f.fields) {
      if (c.type === 'photo' && envio.photos[c.id]) await fotografa(paginaFoto(c));
    }
  } catch (e) {
    throw new Error(t().fmErrPdf);
  } finally {
    palco.remove();
  }

  const d = hoje0();
  const aammdd = String(d.getFullYear()).slice(-2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  const nomeF = paraMl(f.name);
  const titulo = ((nomeF.ja || '').trim() || txt(f.name) || 'formulario').replace(/[\\/:*?"<>|]/g, '-');
  const nome = `${aammdd} ${titulo}（${pessoa.code}）.pdf`;
  const uri = pdf.output('datauristring');
  return { nome, base64: uri.slice(uri.indexOf(',') + 1), blob: pdf.output('blob') };
}

function bindFbForm() {
  const leia = () => {
    draftFb.area = Number(document.getElementById('fArea').value);
    const c = document.getElementById('fCode');
    draftFb.code = c ? c.value : '';
    draftFb.message = document.getElementById('fMsg').value;
  };
  const limpaErro = () => {
    const e = document.getElementById('fErr');
    e.classList.add('hidden'); e.classList.remove('flex');
  };

  // mostra nome e setor assim que o código bate com o cadastro
  const quem = () => {
    const el = document.getElementById('fWho');
    const code = document.getElementById('fCode').value.trim();
    if (USUARIO) return;                   // já identificado pelo login / ログイン済み
    if (!code) { el.textContent = ''; el.className = 'mt-1.5 text-[13px]'; return; }
    const e = empByCode(code);
    if (e) {
      el.className = 'mt-1.5 text-[13px] font-semibold text-leafdark';
      el.textContent = nomePessoa(e) + ' · ' + sectorLabel(e.sector);
    } else {
      el.className = 'mt-1.5 text-[13px] text-amberdark';
      el.textContent = t().fbCodeNotFound;
    }
  };
  quem();

  document.getElementById('fArea').addEventListener('change', limpaErro);
  document.getElementById('fCode').addEventListener('input', () => { limpaErro(); quem(); });
  document.getElementById('fMsg').addEventListener('input', e => {
    limpaErro();
    document.getElementById('fCount').textContent = fmt(t().fbChars, { n: e.target.value.length });
  });

  // foto: uma só, reduzida antes de guardar
  const fp = document.getElementById('fPhoto');
  if (fp) fp.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    leia();
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1280;
        const escala = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * escala);
        cv.height = Math.round(img.height * escala);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        draftFb.photo = cv.toDataURL('image/jpeg', 0.7);
        renderSection();
      };
      img.onerror = () => { const er = document.getElementById('fErr'); er.classList.remove('hidden'); er.classList.add('flex'); er.querySelector('span').textContent = t().fbPhotoBig; };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  const rm = document.getElementById('fPhotoRm');
  if (rm) rm.addEventListener('click', () => { leia(); draftFb.photo = null; renderSection(); });

  document.getElementById('fSend').addEventListener('click', async () => {
    leia();
    const err = document.getElementById('fErr');
    const falha = msg => { err.classList.remove('hidden'); err.classList.add('flex'); err.querySelector('span').textContent = msg; };
    if (!draftFb.message.trim()) return falha(t().fbErr);

    // sempre identificado: o setor vem do cadastro, não do link
    // 常に記名：エリアはリンクではなく登録内容から
    if (!draftFb.code.trim()) return falha(t().fbErrCode);
    const e = empByCode(draftFb.code);
    if (!e) return falha(t().fbCodeNotFound);
    const autor = e.code, setor = e.sector;

    const registro = {
      id: 'f' + Date.now().toString(36),
      sector: setor,
      area: draftFb.area,
      anonymous: false,
      author: autor,
      message: draftFb.message.trim().slice(0, FB_MAX),
      photo: draftFb.photo || null,
      em: new Date().toISOString(), status: 'new', reply: ''
    };

    let protocolo = registro.id.toUpperCase();   // o mesmo id que fica na planilha / シートと同じID
    if (CONECTADO) {
      try {
        const r = await servidor('submitFeedback', registro);
        if (r && r.id) protocolo = String(r.id).toUpperCase();
      } catch (e) {
        return falha(e.message);
      }
    } else {
      const next = structuredClone(DATA);
      next.feedback.unshift(registro);
      await saveContent(next);
    }
    fbSent = protocolo;
    draftFb = { area:0, message:'', anonymous:false, code:'', photo:null };
    renderSection();
    toast(t().fbOkTitle, 4000);

/** Busca as fotos no Drive só quando pedem, uma por uma. / 写真は必要なときだけ読み込みます。 */
async function verFotos(b) {
  const ids = String(b.dataset.fotos || '').split(',').map(s => s.trim()).filter(Boolean);
  const caixa = b.nextElementSibling;
  b.disabled = true; b.textContent = t().fcLoading;
  for (const id of ids) {
    try {
      const src = await servidorEd('fotoFeedback', id);
      if (src) caixa.insertAdjacentHTML('beforeend',
        `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="" class="max-h-56 rounded-xl border border-line object-cover"></a>`);
    } catch (e) { toast(e.message); }
  }
  b.remove();
}

function readEmpComposer() {
  const pin = document.getElementById('ePin');
  draftEmp = {
    name: document.getElementById('eName').value,
    nameJa: document.getElementById('eNameJa').value.trim(),
    code: document.getElementById('eCode').value,
    sector: document.getElementById('eSector').value,
    forklift: document.getElementById('eFork').checked,
    leader: document.getElementById('eLeader').checked,
    pin: pin ? pin.value.trim() : ''
  };
}

function bindEmpComposer() {
  ['eName','eCode'].forEach(id => document.getElementById(id).addEventListener('input', () => {
    const err = document.getElementById('eErr');
    err.classList.add('hidden'); err.classList.remove('flex');
  }));
  document.getElementById('eLeader').addEventListener('change', () => { readEmpComposer(); renderSection(); });
  // sugestão em katakana pelo tradutor do Google / Google翻訳でカタカナの候補
  document.getElementById('eSugJa').addEventListener('click', async () => {
    const nome = document.getElementById('eName').value.trim();
    if (!nome) return toast(t().empSuggestEmpty);
    if (!CONECTADO) return toast(t().trOffline, 4000);
    const b = document.getElementById('eSugJa');
    b.disabled = true;
    try {
      const r = await servidorEd('traduzirCampos', [nome], '', ['ja']);
      const sug = r && r.ja && r.ja[0];
      if (sug) { document.getElementById('eNameJa').value = sug; toast(t().empSuggestDone, 4000); }
    } catch (e) { toast(e.message, 4000); }
    b.disabled = false;
  });
  const ec = document.getElementById('eCancel');
  if (ec) ec.addEventListener('click', () => {
    editingEmp = null;
    draftEmp = novoEmp();
    renderSection();
  });
  document.getElementById('eSave').addEventListener('click', async () => {
    readEmpComposer();
    const { name, nameJa, code, sector, forklift, leader, pin } = draftEmp;
    const err = document.getElementById('eErr');
    const falha = msg => { err.classList.remove('hidden'); err.classList.add('flex'); err.querySelector('span').textContent = msg; };
    if (!name.trim() || !code.trim()) return falha(t().empErr);
    const dup = DATA.employees.some(x => x.code.trim().toLowerCase() === code.trim().toLowerCase() && x.id !== editingEmp);
    if (dup) return falha(t().empDup);

    const antes = editingEmp ? DATA.employees.find(x => x.id === editingEmp) : null;
    const eraLider = !!(antes && antes.leader);
    const mudouCodigo = antes && antes.code.trim().toLowerCase() !== code.trim().toLowerCase();
    if (ehAdmin() && leader) {
      if (pin && !/^\d{4,8}$/.test(pin)) return falha(t().empPinErr);
      if (CONECTADO && !pin && (!temPin(code) || mudouCodigo)) return falha(t().empPinNeed);
    }

    const next = structuredClone(DATA);
    let idEmp = editingEmp;
    const reg = { name, nameJa: nameJa || '', code, sector, forklift, leader: !!leader };
    if (editingEmp) {
      const i = next.employees.findIndex(x => x.id === editingEmp);
      next.employees[i] = { ...next.employees[i], ...reg };
    } else {
      idEmp = 'e' + Date.now().toString(36);
      next.employees.push({ id: idEmp, ...reg });
      next.employees.sort((a, b) => a.name.localeCompare(b.name));
    }
    const msg = editingEmp ? t().empUpd : t().empAdded;
    const ok = await saveContent(next, {
      acao: editingEmp ? 'editado' : 'publicado', tipo: 'funcionario', id: code,
      setor: sector, titulo: name,
      detalhe: [forklift ? 'operador de empilhadeira / フォークリフト運転者' : '',
                leader ? 'líder / リーダー' : ''].filter(Boolean).join(' · ')
    });
    if (!ok) return;

    // PIN fica no servidor, fora do conteúdo / PINはコンテンツ外のサーバーに保存
    if (CONECTADO && ehAdmin()) {
      try {
        if (eraLider && (!leader || mudouCodigo)) await servidor('removerPinLider', antes.code);
        if (leader && pin) { await servidor('definirPinLider', code, pin); toast(t().empPinSaved); }
      } catch (e) { toast(e.message, 5000); }
      PINS_LIDER = null;                 // recarrega a lista / 一覧を再読み込み
    }
    editingEmp = null;
    draftEmp = novoEmp();
    renderSection();
    if (!(CONECTADO && ehAdmin() && leader && pin)) toast(msg);
  });
}

function bindDocComposer(topic) {
  const erro = msg => {
    const e = document.getElementById('dErr');
    e.classList.remove('hidden'); e.classList.add('flex');
    e.querySelector('span').textContent = msg;
  };
  const limpa = () => {
    const e = document.getElementById('dErr');
    e.classList.add('hidden'); e.classList.remove('flex');
  };

  document.getElementById('dName').addEventListener('input', e => { draftDoc.name = e.target.value; limpa(); });

  document.getElementById('dFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    limpa();
    const ehPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    if (!ehPdf) return erro(t().docOnlyPdf);
    if (f.size > DOC_MAX) return erro(t().docTooBig);
    draftDoc.file = f;
    draftDoc.fileName = f.name;
    if (!draftDoc.name.trim()) draftDoc.name = f.name.replace(/\.pdf$/i, '');
    renderSection();
  });

  document.getElementById('dSave').addEventListener('click', () => {
    if (enviandoDoc) return;
    if (!draftDoc.name.trim() || !draftDoc.file) return erro(t().docErr);
    enviandoDoc = true;
    const botao = document.getElementById('dSave');
    botao.textContent = t().docSending;
    const arquivo = draftDoc.file, nomeDoc = draftDoc.name.trim();

    const leitor = new FileReader();
    leitor.onload = async () => {
      const dataUrl = String(leitor.result);
      const registro = {
        id: 'd' + Date.now().toString(36),
        name: { ...mlVazio(), pt: nomeDoc },
        em: new Date().toISOString(),
        mb: (arquivo.size / 1048576).toFixed(1)
      };
      try {
        if (CONECTADO) {
          const r = await servidorEd('uploadDocumento', nomeDoc, dataUrl.split(',')[1], 'application/pdf');
          registro.url = r.url;
          registro.fileId = r.id;
        } else {
          registro.dataUrl = dataUrl;      // só nesta aba / このタブ内のみ
        }
        const next = structuredClone(DATA);
        const alvo = next.sectorTopics.find(x => x.id === topic.id);
        alvo.docs = alvo.docs || [];
        alvo.docs.unshift(registro);
        await saveContent(next, {
          acao: 'publicado', tipo: 'documento', id: registro.fileId || registro.id,
          setor: topic.sector, titulo: nomeDoc,
          detalhe: rotuloHist(topic.name) + ' — ' + registro.mb + ' MB'
        });
        draftDoc = { name:'', file:null, fileName:'' };
        enviandoDoc = false;
        renderSection();
        toast(t().docAdded);
      } catch (err) {
        enviandoDoc = false;
        erro(err.message);
        botao.textContent = t().docNew;
      }
    };
    leitor.onerror = () => { enviandoDoc = false; erro(t().docErr); botao.textContent = t().docNew; };
    leitor.readAsDataURL(arquivo);
  });
}

    draftSec[i].alt  = row.querySelector('[data-f="alt"]').value;
  });
}

function bindSectorsEditor() {
  document.getElementById('secAddBtn').addEventListener('click', () => {
    readSectorsEditor();
    draftSec.push({ id:'', name:'', alt:'' });
    renderSection();
  });
  document.querySelectorAll('[data-srm]').forEach(b => b.addEventListener('click', () => {
    readSectorsEditor();
    draftSec.splice(Number(b.dataset.srm), 1);
    renderSection();
  }));
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast(t().secCopied); } catch (e) {}
  }));
  const tpErro = msg => {
    const e = document.getElementById('tpErr');
    e.classList.remove('hidden'); e.classList.add('flex');
    e.querySelector('span').textContent = msg;
  };
  ['tpPt','tpJa','tpSector'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', () => {
      draftTopic = {
        pt: document.getElementById('tpPt').value,
        ja: document.getElementById('tpJa').value,
        sector: document.getElementById('tpSector').value
      };
      const e = document.getElementById('tpErr');
      e.classList.add('hidden'); e.classList.remove('flex');
    });
  });
  document.getElementById('tpAdd').addEventListener('click', async () => {
    const pt = document.getElementById('tpPt').value.trim();
    const ja = document.getElementById('tpJa').value.trim();
    const setor = document.getElementById('tpSector').value;
    if (!pt && !ja) return tpErro(t().topicErr);
    const next = structuredClone(DATA);
    next.sectorTopics = next.sectorTopics || [];
    const idTopico = 't' + Date.now().toString(36);
    next.sectorTopics.push({
      id: idTopico,
      sector: setor,
      icon: 'folder',
      name: { ...mlVazio(), pt: pt || ja, ja: ja || pt },
      docs: []
    });
    const ok = await saveContent(next, {
      acao: 'publicado', tipo: 'topico', id: idTopico, setor: setor,
      titulo: (pt || ja) + (ja && pt ? ' / ' + ja : '')
    });
    if (!ok) return;
    draftTopic = { pt:'', ja:'', sector: setor };
    renderTopicNav();
    renderSection();
    toast(t().topicAdded);
  });
  document.querySelectorAll('[data-tpdel]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(t().topicConfirm)) return;
    const alvoTp = topicoPorId(b.dataset.tpdel);
    const next = structuredClone(DATA);
    next.sectorTopics = (next.sectorTopics || []).filter(x => x.id !== b.dataset.tpdel);
    const ok = await saveContent(next, {
      acao: 'apagado', tipo: 'topico', id: b.dataset.tpdel,
      setor: alvoTp && alvoTp.sector, titulo: rotuloHist(alvoTp && alvoTp.name),
      detalhe: alvoTp && alvoTp.docs ? alvoTp.docs.length + ' documento(s) / 資料' : ''
    });
    if (!ok) return;
    if (section === 'topic:' + b.dataset.tpdel) section = 'sectors';
    renderTopicNav();
    renderSection();
    toast(t().topicDel);
  }));

  document.getElementById('secCancel').addEventListener('click', () => {
    editingSectors = false; draftSec = null; setSection('panel');
  });
  document.getElementById('secSave').addEventListener('click', async () => {
    readSectorsEditor();
    const limpos = draftSec.filter(x => x.name.trim() || x.alt.trim());
    if (limpos.some(x => !x.name.trim())) {
      const err = document.getElementById('secErr');
      err.classList.remove('hidden'); err.classList.add('flex');
      err.querySelector('span').textContent = t().secErrName;
      return;
    }
    const usados = new Set();
    limpos.forEach(x => {
      if (!x.id) {
        let base = x.name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 's';
        let cand = base, k = 2;
        while (usados.has(cand) || DATA.sectors.some(y => y.id === cand)) cand = base + '-' + k++;
        x.id = cand;
      }
      usados.add(x.id);
    });
    const next = structuredClone(DATA);
    next.sectors = limpos;
    if (activeSector && !limpos.some(x => x.id === activeSector)) activeSector = null;
    const ok = await saveContent(next, {
      acao: 'editado', tipo: 'setor',
      titulo: limpos.map(x => x.alt ? x.name + ' / ' + x.alt : x.name).join(' • '),
      detalhe: limpos.length + ' setor(es) / エリア'
    });
    if (!ok) return;
    editingSectors = false; draftSec = null;
    renderSectorMenu();
    setSection('panel');
    toast(t().secSaved);
  });
}

/* Perfil da empresa em vários idiomas. Todo texto vira { pt, en, ja, es, id };
   o conteúdo antigo, em texto simples, conta como português.
   会社概要の多言語化。文字列はすべて多言語形式にし、旧データはポルトガル語として扱います。 */
function normalizaCo(c) {
  const par = x => ({ label: paraMl(x && x.label), value: paraMl(x && x.value) });
  return {
    intro: paraMl(c && c.intro),
    stats: ((c && c.stats) || []).map(par),
    values: ((c && c.values) || []).map(paraMl),
    contacts: ((c && c.contacts) || []).map(par)
  };
}
const textosDoCo = c => [c.intro]
  .concat(...c.stats.map(x => [x.label, x.value]))

  .concat(...c.contacts.map(x => [x.label, x.value]));

    <i data-lucide="plus" class="h-4 w-4"></i>${t().coAdd}</button>`;
}

  const c = draftCo;
  return `
    <div class="rounded-2xl border border-dashed border-brand/40 bg-brandsoft/50 p-5">
      <p class="flex items-center gap-2 text-[13px] font-bold text-brand">
        <i data-lucide="pencil-line" class="h-4 w-4"></i>${t().coEdit}
      </p>
      ${abasIdioma(textosDoCo(c), 'c', draftCoLang, 'coTr')}

      <div class="mt-4">
        <label for="coIntro" class="mb-1.5 block text-[13px] font-semibold text-ink">${t().coIntroL} <span class="font-normal text-slate-400">(${LANG_CODE[draftCoLang]})</span></label>
        <textarea id="coIntro" rows="4" class="field" placeholder="${esc(txt(c.intro))}">${esc(c.intro[draftCoLang] || '')}</textarea>
      </div>

      <p class="mt-6 text-[13px] font-semibold text-slate-500">${t().coStatsL}</p>
      <div class="mt-2 space-y-3">${pairRows(c.stats, 'stats', t().coLabel, t().coValue)}</div>
      ${addBtn('stats')}

      <p class="mt-6 text-[13px] font-semibold text-slate-500">${t().coValuesL}</p>
      <div class="mt-2 space-y-3">${textRows(c.values, 'values', t().coText)}</div>
      ${addBtn('values')}

      <p class="mt-6 text-[13px] font-semibold text-slate-500">${t().coContactsL}</p>
      <div class="mt-2 space-y-3">${pairRows(c.contacts, 'contacts', t().coLabel, t().coValue)}</div>
      ${addBtn('contacts')}

      <p id="coErr" class="mt-4 hidden items-center gap-2 rounded-lg bg-red-50 px-3 py-2.5 text-[14px] font-medium text-red-700">
        <i data-lucide="circle-alert" class="h-4 w-4 shrink-0"></i><span></span>
      </p>

      <div class="mt-5 flex flex-wrap justify-end gap-2">
        <button id="coCancel" class="min-h-[44px] rounded-lg border border-line bg-white px-4 text-sm font-semibold text-slate-600 hover:bg-slate-50">${t().nCancel}</button>
        <button id="coSave" class="inline-flex min-h-[44px] items-center gap-2 rounded-lg bg-ink px-4 text-sm font-semibold text-white hover:bg-ink2">
