<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ジョイワーク - 従業員ポータル</title>

<!--
  Página "casca" do Portal Joywork / Joyworkポータルの「外枠」ページ

  O Google Apps Script não deixa a página do portal ter o ícone da tela inicial
  (apple-touch-icon) nem o manifesto do Android. Esta página pequena tem os
  dois e mostra o portal dentro dela, em tela cheia. É ESTE endereço que os
  funcionários adicionam à tela inicial: assim aparece o logo da Joywork.

  Google Apps Script ではホーム画面用アイコンとマニフェストを設定できないため、
  このページがアイコンを持ち、ポータルを全画面で表示します。従業員はこのページの
  アドレスをホーム画面に追加してください（Joyworkのロゴが表示されます）。

  Se o endereço do portal mudar, troque só a linha do PORTAL abaixo.
  ポータルのURLが変わった場合は、下の PORTAL の行だけを変更してください。
-->

<!-- ícone e aplicativo / アイコンとアプリ設定 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ジョイワーク">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="ジョイワーク - 従業員ポータル">
<meta name="theme-color" content="#ffffff">

<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  /* o portal ocupa a tela toda, respeitando o entalhe do iPhone
     ポータルを全画面に表示（iPhoneの切り欠きに対応） */
  #portal {
    position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0;
    padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #ffffff;
  }
  /* abertura enquanto o portal carrega / 読み込み中の表示 */
  #abertura {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #ffffff; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    transition: opacity .35s ease; z-index: 2;
  }
  #abertura img { width: 120px; height: 120px; }
  #abertura p { margin: 0; color: #64748B; font-size: 14px; }
  #abertura.some { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="abertura"><img src="icone-192.png" alt="Joywork"><p>Portal do Funcionário · 従業員ポータル</p></div>
  <!-- web-share: libera o botão "Compartilhar" (WhatsApp, LINE) das patrulhas / 巡回の「共有」ボタンを許可 -->
  <iframe id="portal" title="Joywork — Portal do Funcionário" allow="clipboard-write; web-share"
    src="https://script.google.com/macros/s/AKfycbyx2QgaMQOxIRZVNsaHc5IupS0lrcu0yWNEoOMlrSzYvVhcZjdCm432nHAzlgO5l_kz/exec"></iframe>
  <script>
    // tira a abertura quando o portal terminar de carregar (ou depois de 8 s)
    // ポータルの読み込み完了後（最長8秒）に起動画面を閉じます
    (function () {
      var a = document.getElementById('abertura');
      function some() { a.className = 'some'; setTimeout(function () { a.remove(); }, 400); }
      document.getElementById('portal').addEventListener('load', function () { setTimeout(some, 600); });
      setTimeout(some, 8000);
    })();
  </script>
</body>
</html>
