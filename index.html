/* Lê a tela para dentro de draftCo, no idioma que está sendo digitado.
   画面の入力内容を、入力中の言語として draftCo に読み込みます。 */
function readCompanyEditor() {
  const L = draftCoLang;
  const intro = document.getElementById('coIntro');
  if (intro) draftCo.intro[L] = intro.value;
  document.querySelectorAll('[data-row]').forEach(row => {
    const key = row.dataset.row, i = Number(row.dataset.i);
    if (key === 'values') {
      draftCo.values[i][L] = row.querySelector('[data-f="text"]').value;
    } else {
      draftCo[key][i].label[L] = row.querySelector('[data-f="label"]').value;
      draftCo[key][i].value[L] = row.querySelector('[data-f="value"]').value;
    }
  });
}

function bindCompanyEditor() {
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    readCompanyEditor();
    const k = b.dataset.add;
    draftCo[k].push(k === 'values' ? mlVazio() : { label: mlVazio(), value: mlVazio() });
    renderSection();
  }));
  document.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    readCompanyEditor();
    draftCo[b.dataset.rm].splice(Number(b.dataset.i), 1);
    renderSection();
  }));
  document.querySelectorAll('[data-clang]').forEach(b => b.addEventListener('click', () => {
    readCompanyEditor();
    draftCoLang = b.dataset.clang;
    renderSection();
  }));
  const tr = document.getElementById('coTr');
  if (tr) tr.addEventListener('click', async () => {
    readCompanyEditor();
    if (await traduzirMl(textosDoCo(draftCo), draftCoLang, tr)) renderSection();
  });
  document.getElementById('coCancel').addEventListener('click', () => {
    editingCompany = false; draftCo = null; renderSection();
  });
  document.getElementById('coSave').addEventListener('click', async () => {
    readCompanyEditor();
    if (!mlTem(draftCo.intro)) {
      const err = document.getElementById('coErr');
      err.classList.remove('hidden'); err.classList.add('flex');
      err.querySelector('span').textContent = t().coErrEmpty;
      return;
    }
    const temPar = x => mlTem(x.label) || mlTem(x.value);
    const next = structuredClone(DATA);
    next.company = {
      intro: draftCo.intro,
      stats: draftCo.stats.filter(temPar),
      values: draftCo.values.filter(v => mlTem(v)),
      contacts: draftCo.contacts.filter(temPar)
    };
    const ok = await saveContent(next, {
      acao: 'editado', tipo: 'empresa',
      titulo: 'Perfil da empresa / 会社概要', detalhe: rotuloHist(draftCo.intro)
    });
    if (!ok) return;
    editingCompany = false; draftCo = null;
    renderSection();
    toast(t().coSaved);
  });
}

function renderSection() {
  const head = document.getElementById('sectionHead');
  const body = document.getElementById('sectionBody');

  const selo = activeSector ? `
    <div class="mb-4 flex flex-wrap items-center gap-x-3 gap-y-1 rounded-xl border border-line bg-white px-4 py-3">
      <span class="inline-flex items-center gap-2 rounded-full bg-leafsoft px-3 py-1 text-[14px] font-bold text-leafdark">
        <i data-lucide="map-pin" class="h-4 w-4"></i>${esc(sectorLabel(activeSector))}
      </span>
      <span class="text-[13px] text-slate-500">${t().secFiltered}</span>
      <button id="clearSector" class="ml-auto min-h-[38px] rounded-lg border border-line px-3 text-[13px] font-semibold text-brand hover:bg-brandsoft">${t().secAll}</button>
    </div>` : '';

  head.innerHTML = selo + `
    <div class="flex flex-wrap items-end justify-between gap-3">
      <h1 class="font-head text-2xl font-extrabold text-ink sm:text-[28px]">${
        section.indexOf('topic:') === 0
          ? esc(txt((topicoPorId(section.slice(6)) || {}).name) || '')
          : section.indexOf('form:') === 0
          ? esc(txt((formPorId(section.slice(5)) || {}).name) || '')
          : (section === 'sectors' ? t().secManage : t()[NAV_KEY[section]])
      }</h1>
      ${section.indexOf('topic:') === 0 ? `<p class="text-[14px] text-slate-500">${fmt(t().docCount, { n: ((topicoPorId(section.slice(6)) || {}).docs || []).length })}</p>` : ''}
      ${section === 'notif' ? `<p class="text-[14px] text-slate-500">${fmt(t().nCount, { n: visibleNotices().length })}</p>` : ''}
      ${section === 'forms' ? `<p class="text-[14px] text-slate-500">${fmt(t().fmCount, { n: visibleForms().length })}</p>` : ''}
      ${section === 'feedback' && isAdmin() ? `<p class="text-[14px] text-slate-500">${fmt(t().fbCount, { n: visibleFeedback().length })}</p>` : ''}
      ${section === 'employee' ? `<p class="text-[14px] text-slate-500">${fmt(t().empCount, { n: visibleEmployees().length })} · ${fmt(t().empFork, { n: visibleEmployees().filter(e => e.forklift).length })}</p>` : ''}
      ${section === 'company' && isAdmin() && !editingCompany ? `
        <button id="coEditBtn" class="inline-flex min-h-[44px] items-center gap-2 rounded-lg border border-line px-3 text-sm font-semibold text-brand hover:bg-brandsoft">
          <i data-lucide="pencil" class="h-4 w-4"></i>${t().coEdit}
        </button>` : ''}
    </div>`;

  const cs = document.getElementById('clearSector');
  if (cs) cs.addEventListener('click', () => setSector(null));

  const eb = document.getElementById('coEditBtn');
  if (eb) eb.addEventListener('click', () => {
    editingCompany = true;
    draftCo = normalizaCo(DATA.company);
    renderSection();
  });

  renderComposer();

  if (section === 'notif') {
    const lista = visibleNotices()
      .slice().sort((a, b) => (b.destaque ? 1 : 0) - (a.destaque ? 1 : 0));   // destaques primeiro / 注目を先頭に
    body.innerHTML = lista.length
      ? `<ul class="overflow-hidden rounded-2xl border border-line bg-white">${lista.map(noticeCard).join('')}</ul>`
      : `<div class="rounded-2xl border border-dashed border-line bg-white px-6 py-14 text-center text-[15px] text-slate-400">${t().nEmpty}</div>`;

    body.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
      const n = DATA.notices.find(x => x.id === b.dataset.edit);
      editingId = n.id;
      draft = { sector:n.sector || 'all', tag:paraMl(n.tag), title:paraMl(n.title), body:paraMl(n.body),
                photo: n.photo || null, doc: n.doc || null, destaque: !!n.destaque };
      renderComposer();
      document.getElementById('composer').scrollIntoView({ behavior:'smooth', block:'center' });
    }));
    body.querySelectorAll('[data-star]').forEach(b => b.addEventListener('click', async () => {
      const alvo = DATA.notices.find(x => x.id === b.dataset.star);
      if (!alvo) return;
      const liga = !alvo.destaque;
      const next = structuredClone(DATA);
      next.notices.find(x => x.id === alvo.id).destaque = liga;
      const ok = await saveContent(next, {
        acao: 'editado', tipo: 'aviso', id: alvo.id, setor: alvo.sector,
        titulo: rotuloHist(alvo.title),
        detalhe: liga ? '★ destaque ligado / 注目に設定' : 'destaque desligado / 注目を解除'
      });
      if (!ok) return;
      renderSection();
      toast(liga ? t().nDestaqueOn : t().nDestaqueOff);
    }));
    body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm(t().nConfirm)) return;
      const alvoAviso = DATA.notices.find(x => x.id === b.dataset.del);
      const next = structuredClone(DATA);
      next.notices = next.notices.filter(x => x.id !== b.dataset.del);
      const ok = await saveContent(next, {
        acao: 'apagado', tipo: 'aviso', id: b.dataset.del,
        setor: alvoAviso && alvoAviso.sector, titulo: rotuloHist(alvoAviso && alvoAviso.title),
        detalhe: rotuloHist(alvoAviso && alvoAviso.body)
      });
      if (!ok) return;
      if (editingId === b.dataset.del) { editingId = null; draft = { sector: activeSector || 'all', tag:mlVazio(), title:mlVazio(), body:mlVazio(), photo:null, doc:null, destaque:false }; }
      renderSection();
      toast(t().nDel);
    }));
  } else if (section === 'forms') {
    const lista = visibleForms();
    body.innerHTML = modelosProntos() + (lista.length
      ? `<div class="grid gap-4 lg:grid-cols-2">${lista.map(formCard).join('')}</div>`
      : `<div class="rounded-2xl border border-dashed border-line bg-white px-6 py-14 text-center text-[15px] text-slate-400">${t().fmEmpty}</div>`);
    body.querySelectorAll('[data-mdladd]').forEach(b => b.addEventListener('click', () => adicionarModelo(b.dataset.mdladd)));

    body.querySelectorAll('[data-fmedit]').forEach(b => b.addEventListener('click', () => {
      const f = DATA.forms.find(x => x.id === b.dataset.fmedit);
      editingFm = f.id;
      draftFm = rascunhoDoFm(f);
      renderSection();
      document.getElementById('composer').scrollIntoView({ behavior:'smooth', block:'start' });
    }));
    body.querySelectorAll('[data-fmfill]').forEach(b => b.addEventListener('click', () =>
      setSection('form:' + b.dataset.fmfill)
    ));
    body.querySelectorAll('[data-fmdel]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm(t().fmConfirm)) return;
      const alvoFm = DATA.forms.find(x => x.id === b.dataset.fmdel);
      const next = structuredClone(DATA);
      next.forms = next.forms.filter(x => x.id !== b.dataset.fmdel);
      const ok = await saveContent(next, {
        acao: 'apagado', tipo: 'formulario', id: b.dataset.fmdel,
        setor: alvoFm && alvoFm.sector, titulo: rotuloHist(alvoFm && alvoFm.name)
      });
      if (!ok) return;
      if (editingFm === b.dataset.fmdel) {
        editingFm = null;
        draftFm = novoFm();
      }
      renderSection();
      toast(t().fmDel);
    }));
  } else if (section.indexOf('form:') === 0) {
    const f = formPorId(section.slice(5));
    if (!f) { setSection('forms'); return; }
    // troca de idioma redesenha a tela: guarda o que já foi digitado
    // 言語切替で再描画するため、入力済みの内容を先に読み込みます
    if (envio && envio.formId === f.id && document.getElementById('vSend')) leiaEnvio();
    body.innerHTML = fmFillView(f);
    body.querySelectorAll('[data-go]').forEach(b =>
      b.addEventListener('click', () => setSection(b.dataset.go))
    );
    bindFmFill(f);
  } else if (section.indexOf('topic:') === 0) {
    const topic = topicoPorId(section.slice(6));
    const docs = (topic && topic.docs) || [];
    body.innerHTML = docs.length
      ? `<ul class="overflow-hidden rounded-2xl border border-line bg-white">${docs.map(docCard).join('')}</ul>`
      : `<div class="rounded-2xl border border-dashed border-line bg-white px-6 py-14 text-center text-[15px] text-slate-400">${t().docEmpty}</div>`;

    body.querySelectorAll('[data-docdel]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm(t().docConfirm)) return;
      const alvoDoc = docs.find(x => x.id === b.dataset.docdel);
      if (CONECTADO && alvoDoc && alvoDoc.fileId) {
        try { await servidorEd('apagarDocumento', alvoDoc.fileId); } catch (e) { return toast(e.message); }
      }
      const next = structuredClone(DATA);
      const tt = next.sectorTopics.find(x => x.id === topic.id);
      tt.docs = (tt.docs || []).filter(x => x.id !== b.dataset.docdel);
      const ok = await saveContent(next, {
        acao: 'apagado', tipo: 'documento',
        id: (alvoDoc && (alvoDoc.fileId || alvoDoc.id)) || b.dataset.docdel,
        setor: topic.sector, titulo: rotuloHist(alvoDoc && alvoDoc.name),
        detalhe: rotuloHist(topic.name)
      });
      if (!ok) return;
      renderSection();
      toast(t().docDel);
    }));
  } else if (section === 'panel') {
    body.innerHTML = blocoBloqueios() + blocoDestaques() + panelView();
    body.querySelectorAll('[data-bq]').forEach(b => b.addEventListener('click', () => resolverBloqueio(b)));
    body.querySelectorAll('[data-go]').forEach(b =>
      b.addEventListener('click', () => setSection(b.dataset.go))
    );
  } else if (section === 'feedback') {
    if (!isAdmin()) {
      body.innerHTML = fichasAtalhos() + fbForm();
      body.querySelectorAll('[data-ficha]').forEach(b =>
        b.addEventListener('click', () => setSection('form:' + b.dataset.ficha)));
      bindFbForm();
    } else {
      if (CONECTADO && !fbCarregado) {
        fbCarregado = true;
        servidorEd('listFeedback')
          .then(linhas => { DATA.feedback = linhas || []; renderSection(); })
          .catch(e => toast(e.message));
      }
      const lista = visibleFeedback().filter(f => fbFiltro === 'all' || (f.kind || 'msg') === fbFiltro);
      body.innerHTML = filtrosFeedback() + (lista.length
        ? `<ul class="overflow-hidden rounded-2xl border border-line bg-white">${lista.map(fbCard).join('')}</ul>`
        : `<div class="rounded-2xl border border-dashed border-line bg-white px-6 py-14 text-center text-[15px] text-slate-400">${t().fbEmpty}</div>`);
      body.querySelectorAll('[data-fbf]').forEach(b => b.addEventListener('click', () => {
        fbFiltro = b.dataset.fbf; renderSection();
      }));
      body.querySelectorAll('[data-fotos]').forEach(b => b.addEventListener('click', () => verFotos(b)));

      body.querySelectorAll('[data-fsave]').forEach(b => b.addEventListener('click', async () => {
        const id = b.dataset.fsave;
        const next = structuredClone(DATA);
        const f = next.feedback.find(x => x.id === id);
        f.reply = document.getElementById('r_' + id).value;
        f.status = document.querySelector(`[data-fstatus="${id}"]`).value;
        if (CONECTADO) {
          try { await servidorEd('updateFeedback', id, f.status, f.reply); }
          catch (e) { return toast(e.message); }
        }
        DATA = next;
        if (!CONECTADO) await saveContent(next);
        renderSection();
        toast(t().fbSaved);
      }));
      body.querySelectorAll('[data-fdel]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm(t().fbConfirm)) return;
        if (CONECTADO) {
          try { await servidorEd('deleteFeedback', b.dataset.fdel); }
          catch (e) { return toast(e.message); }
        }
        const next = structuredClone(DATA);
        next.feedback = next.feedback.filter(x => x.id !== b.dataset.fdel);
        DATA = next;
        if (!CONECTADO) await saveContent(next);
        renderSection();
        toast(t().fbDeleted);
      }));
    }
  } else if (section === 'employee') {
    // a administração vê quem já tem PIN / 管理部門はPIN設定状況を確認できます
    if (CONECTADO && ehAdmin() && PINS_LIDER === null) {
      PINS_LIDER = [];
      servidor('listarPinsLider').then(l => { PINS_LIDER = l || []; renderSection(); }).catch(() => {});
    }
    const lista = visibleEmployees();
    const busca = `
      <div class="relative mb-4">
        <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
        <input id="empSearch" class="field pl-10" placeholder="${t().empSearch}" value="${esc(empQuery)}">
      </div>`;
    body.innerHTML = busca + (lista.length
      ? `<ul class="overflow-hidden rounded-2xl border border-line bg-white">${lista.map(empCard).join('')}</ul>`
      : `<div class="rounded-2xl border border-dashed border-line bg-white px-6 py-14 text-center text-[15px] text-slate-400">${DATA.employees.length ? t().empNoResult : t().empEmpty}</div>`);

    const sb = document.getElementById('empSearch');
    sb.addEventListener('input', e => {
      empQuery = e.target.value;
      const pos = e.target.selectionStart;
      renderSection();
      const novo = document.getElementById('empSearch');
      novo.focus();
      novo.setSelectionRange(pos, pos);
    });

    body.querySelectorAll('[data-eedit]').forEach(b => b.addEventListener('click', () => {
      const e = DATA.employees.find(x => x.id === b.dataset.eedit);
      editingEmp = e.id;
      draftEmp = { name:e.name, nameJa:e.nameJa || '', code:e.code, sector:e.sector, forklift:e.forklift, leader:!!e.leader, pin:'' };
      renderSection();
      document.getElementById('composer').scrollIntoView({ behavior:'smooth', block:'center' });
    }));
    body.querySelectorAll('[data-edel]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm(t().empConfirm)) return;
      const alvoEmp = DATA.employees.find(x => x.id === b.dataset.edel);
      if (alvoEmp && alvoEmp.leader && !ehAdmin()) return toast(t().empPinOnlyAdmin, 4000);
      const next = structuredClone(DATA);
      next.employees = next.employees.filter(x => x.id !== b.dataset.edel);
      const ok = await saveContent(next, {
        acao: 'apagado', tipo: 'funcionario', id: alvoEmp && alvoEmp.code,
        setor: alvoEmp && alvoEmp.sector, titulo: alvoEmp && alvoEmp.name
      });
      if (!ok) return;
      if (CONECTADO && ehAdmin() && alvoEmp && alvoEmp.leader) {
        try { await servidor('removerPinLider', alvoEmp.code); } catch (e) {}
        PINS_LIDER = null;
      }
      if (editingEmp === b.dataset.edel) {
        editingEmp = null;
        draftEmp = novoEmp();
      }
      renderSection();
      toast(t().empDel);
    }));
  } else if (section === 'sectors') {
    if (!draftSec) draftSec = structuredClone(DATA.sectors);
    body.innerHTML = sectorsEditor();
    bindSectorsEditor();
  } else if (section === 'company') {
    body.innerHTML = editingCompany ? companyEditor() : companyView(DATA.company);
    if (editingCompany) bindCompanyEditor();
  } else {
    body.innerHTML = `
      <div class="rounded-2xl border border-dashed border-line bg-white px-6 py-16 text-center">
        <i data-lucide="layout-dashboard" class="mx-auto h-7 w-7 text-slate-300"></i>
        <p class="mx-auto mt-4 max-w-[46ch] text-[15px] leading-relaxed text-slate-500">${t().soonSection}</p>
      </div>`;
  }
  lucide.createIcons();
}

function applyRole() {
  pintaPapel();
  document.getElementById('adminBar').classList.toggle('hidden', !isAdmin());
  renderSection();
}

/* ---------- avisos rápidos na tela ---------- */
let toastTimer;
function toast(msg, ms) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('p');
    el.id = 'toast';
    el.className = 'pointer-events-none fixed bottom-6 left-1/2 z-[80] hidden max-w-[92vw] -translate-x-1/2 rounded-lg bg-ink px-4 py-3 text-sm font-medium leading-relaxed text-white shadow-lg';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), ms || 2600);
}

function applyLang() {
  const d = t();
  document.documentElement.lang = HTML_LANG[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = d[el.dataset.i18n];
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => {
    const v = d[el.dataset.i18nAria];
    if (typeof v === 'string') el.setAttribute('aria-label', v);
  });
  document.title = 'Joywork — ' + d.brandSub;   // título da aba / タブのタイトル
  renderLogin();                          // se a tela de login estiver aberta / ログイン画面も更新
  document.getElementById('langCode').textContent = LANG_CODE[lang];
  document.querySelectorAll('[data-lang]').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.lang === lang))
  );
  pintaPapel();
  pintaFaixa();
  renderSectorMenu();
  renderTopicNav();
  renderSection();
  lucide.createIcons();
}

const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');
function openDrawer()  { sidebar.classList.remove('-translate-x-full'); scrim.classList.remove('hidden'); }
function closeDrawer() { sidebar.classList.add('-translate-x-full');    scrim.classList.add('hidden'); }

function setSection(key) {
  section = key;
  draftDoc = { name:'', file:null, fileName:'' };
  // a página de um formulário fica dentro de "Formulários" no menu
  // 各フォームのページは、メニュー上「申請フォーム」の中として扱います
  const navAtivo = key.indexOf('form:') === 0
    ? (ehFicha(formPorId(key.slice(5))) ? 'feedback' : 'forms') : key;
  document.querySelectorAll('[data-nav]').forEach(b =>
    b.dataset.nav === navAtivo ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')
  );
  if (key.indexOf('form:') !== 0) envio = null;
  editingId = null;
  editingCompany = false; draftCo = null;
  if (key !== 'sectors') { editingSectors = false; draftSec = null; }
  if (key !== 'employee') { editingEmp = null; empQuery = ''; }
  if (key !== 'feedback') { fbSent = null; }
  if (key !== 'forms') { editingFm = null; }
  draftFm = novoFm();
  draftEmp = novoEmp();
  renderTopicNav();
  renderSection();
  closeDrawer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderLogin() {
  const el = document.getElementById('login');
  if (!el) return;
  const guarda = {};                    // o que já foi digitado / 入力済みの内容
  ['lgCodF', 'lgCodL', 'lgPin'].forEach(id => { const i = document.getElementById(id); if (i) guarda[id] = i.value; });
  el.innerHTML = htmlLogin();
  Object.keys(guarda).forEach(id => { const i = document.getElementById(id); if (i) i.value = guarda[id]; });
  bindLogin();
}

function abrirLogin() {
  if (document.getElementById('login')) return renderLogin();
  const el = document.createElement('div');
  el.id = 'login';
  el.setAttribute('role', 'main');
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  renderLogin();
  const c = document.getElementById('lgCodF') || document.getElementById('lgCodL');
  if (c) c.focus();
}

function fecharLogin() {
  const el = document.getElementById('login');
  if (el) el.remove();
  document.body.style.overflow = '';
}

function bindLogin() {
  const $ = id => document.getElementById(id);
  const erro = msg => { const e = $('lgErro'); if (!e) return; e.textContent = msg || ''; e.hidden = !msg; };
  const quem = (inp, out) => {
    const i = $(inp), o = $(out);
    if (!i || !o) return;
    const v = i.value.trim(), p = v ? empByCode(v) : null;
    o.className = 'lg-quemsou' + (v && !p ? ' nao' : '');
    o.textContent = !v ? '' : p ? '✓ ' + nomePessoa(p) + ' · ' + sectorLabel(p.sector) : t().fbCodeNotFound;
  };
  quem('lgCodF', 'lgQuemF'); quem('lgCodL', 'lgQuemL');

  document.querySelectorAll('[data-lgaba]').forEach(b => b.addEventListener('click', () => { lgAba = b.dataset.lgaba; renderLogin(); }));
  $('lgLangBtn').addEventListener('click', e => { e.stopPropagation(); lgIdiomaAberto = !lgIdiomaAberto; renderLogin(); });
  document.querySelectorAll('[data-lglang]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lglang; lgIdiomaAberto = false; applyLang();   // applyLang redesenha o login / ログインも再描画
  }));

  // funcionário / 従業員
  if ($('lgCodF')) {
    $('lgCodF').addEventListener('input', () => { quem('lgCodF', 'lgQuemF'); erro(''); });
    $('lgCodF').addEventListener('keydown', e => { if (e.key === 'Enter') $('lgEntrarF').click(); });
    $('lgEntrarF').addEventListener('click', () => {
      const v = $('lgCodF').value.trim();
      if (!v) return erro(t().fmErrCode);
      const p = empByCode(v);
      if (!p) return erro(t().fbCodeNotFound);
      USUARIO = p.code;
      guardaCodigo(p.code, $('lgLembrar').checked);
      role = 'staff'; LIDER = null;
      fecharLogin();
      trocouPapel();
      toast(fmt(t().lgBemvindo, { n: nomePessoa(p) }), 3500);
    });
  }

  // líder / リーダー
  if ($('lgCodL')) {
    $('lgCodL').addEventListener('input', () => { quem('lgCodL', 'lgQuemL'); erro(''); });
    $('lgOlho').addEventListener('click', () => { const i = $('lgPin'); i.type = i.type === 'password' ? 'text' : 'password'; });
    $('lgPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('lgEntrarL').click(); });
    $('lgEntrarL').addEventListener('click', async () => {
      const code = $('lgCodL').value.trim(), pin = $('lgPin').value.trim();
      if (!code || !pin) return erro(t().ldErrEmpty);
      const b = $('lgEntrarL');
      b.disabled = true;
      try {
        if (CONECTADO) {
          const r = await servidor('entrarLider', code, pin);
          guardaToken(r.token);
          LIDER = { nome: r.nome, nomeJa: r.nomeJa || '', codigo: r.codigo };
          role = 'leader';
          DATA = await loadContent();      // com os e-mails, para editar sem perdê-los / メール付きで再読込
        } else {
          // demonstração: qualquer PIN de 4 a 8 números para quem é líder / デモ用
          const p = empByCode(code);
          if (!p) throw new Error(t().fbCodeNotFound);
          if (!p.leader) throw new Error(t().lgNaoLider);
          if (!/^\d{4,8}$/.test(pin)) throw new Error(t().e_pinFormato);
          LIDER = { nome: p.name, nomeJa: p.nameJa || '', codigo: p.code };
          role = 'leader';
        }
        USUARIO = LIDER.codigo;
        fecharLogin();
        trocouPapel();
        toast(t().ldOk);
      } catch (e) {
        b.disabled = false;
        $('lgPin').value = '';
        erro(e.message);
      }
    });
  }

  // administração (só na demonstração; no ar é o link do Google) / 管理部門（デモのみ）
  if ($('lgEntrarAdm')) $('lgEntrarAdm').addEventListener('click', () => {
    role = 'admin'; LIDER = null; USUARIO = null;
    fecharLogin();
    trocouPapel();
  });
}
document.addEventListener('click', () => { if (lgIdiomaAberto) { lgIdiomaAberto = false; renderLogin(); } });

/** Sair: volta para a tela de login. / ログアウトしてログイン画面へ。 */
function sairDoPortal() {
  USUARIO = null;
  guardaCodigo('');
  role = 'staff'; LIDER = null;
  trocouPapel();
  abrirLogin();
}

/* ---------- papel: administração, líder, funcionário ----------
   No ar: administração vem do e-mail; líder entra aqui com código + PIN.
   Na demonstração: o botão alterna entre os três papéis.
   公開時：管理部門はメールで判定、リーダーはここで社員コード＋PINでログイン。
   デモ：ボタンで3つの役割を切り替えます。 */
let SESSAO_EMAIL = '';
let BLOQUEIOS = [];                     // líderes bloqueados por PIN errado (só administração) / ロック通知

/* Faixa "Bem-vindo(a), nome" — fica no alto de todas as páginas.
   「ようこそ、〇〇さん」の帯。全ページの上部に表示します。 */
function pintaBemVindo() {
  const faixa = document.getElementById('bemVindo');
  if (!faixa) return;
  const eu = USUARIO ? empByCode(USUARIO) : null;
  const admin = role === 'admin';
  faixa.classList.toggle('hidden', !eu && !admin);
  if (!eu && !admin) return;
  const nome = eu ? nomePessoa(eu) : (SESSAO_EMAIL || t().roleAdmin);
  document.getElementById('bvTexto').innerHTML = esc(fmt(t().lgBemvindo, { n: '@@N@@' })).replace('@@N@@',`<b class="font-extrabold">${esc(nome)}</b>`);
  document.getElementById('bvInfo').textContent = eu
    ? [eu.code, sectorLabel(eu.sector), role === 'leader' ? t().roleLeader : ''].filter(Boolean).join(' · ')
    : (SESSAO_EMAIL ? t().roleAdmin : '');
  document.getElementById('bvSairTxt').textContent = t().lgSair;
  document.getElementById('bvSair').classList.toggle('hidden', CONECTADO && admin);
}

function pintaPapel() {
  pintaBemVindo();
  // funcionário identificado aparece pelo nome / 識別済みの従業員は氏名で表示
  const eu = USUARIO ? empByCode(USUARIO) : null;
  const nome = role === 'admin' ? t().roleAdmin
    : role === 'leader' ? t().roleLeader
    : (eu ? nomePessoa(eu) : t().roleStaff);
  document.getElementById('roleName').textContent = nome;
  document.getElementById('roleBtn').title = (CONECTADO && role === 'admin') ? nome : t().lgSair;
}

function pintaFaixa() {
  const f = document.getElementById('modoFaixa');
  if (!CONECTADO) {
    f.className = 'border-b border-line bg-ambersoft px-4 py-2 text-[13px] text-amberdark sm:px-6';
    f.textContent = t().demoModo;
  } else if (role === 'leader' && LIDER) {
    f.className = 'border-b border-line bg-leafsoft px-4 py-2 text-[13px] font-semibold text-leafdark sm:px-6';
    f.textContent = fmt(t().ldAs, { n: (lang === 'ja' && LIDER.nomeJa) ? LIDER.nomeJa : LIDER.nome, c: LIDER.codigo });
  } else if (SESSAO_EMAIL) {
    f.className = 'border-b border-line bg-brandsoft px-4 py-2 text-[13px] text-brand sm:px-6';
    f.textContent = fmt(t().conectado, { e: SESSAO_EMAIL });
  } else {
    f.className = 'hidden';
  }
}

async function sairDoLider(msg) {
  const tk = TOKEN_LIDER;
  guardaToken('');
  LIDER = null;
  role = 'staff';
  USUARIO = null;
  guardaCodigo('');
  trocouPapel();
  abrirLogin();                           // volta para a tela de login / ログイン画面へ
  toast(msg || t().ldOut);
  if (tk && CONECTADO) { try { await servidor('sairLider', tk); } catch (e) {} }
}

/** Depois de trocar de papel: limpa rascunhos e redesenha. / 役割変更後の再描画。 */
function trocouPapel() {
  editingId = null;
  editingCompany = false; draftCo = null;
  editingSectors = false; draftSec = null;
  editingEmp = null;
  editingFm = null;
  fbSent = null;
  fbCarregado = false;
  PINS_LIDER = null;
  draftEmp = novoEmp();
  draft = { sector: activeSector || 'all', tag:mlVazio(), title:mlVazio(), body:mlVazio(), photo:null, doc:null, destaque:false };
  if (!isAdmin() && section === 'sectors') section = 'panel';
  pintaFaixa();
  renderSectorMenu();
  applyRole();
}

document.getElementById('bvSair').addEventListener('click', () => document.getElementById('roleBtn').click());
document.getElementById('roleBtn').addEventListener('click', () => {
  // botão do nome: sair (volta para a tela de login) / 名前ボタン：ログアウト
  if (CONECTADO && role === 'admin') return;          // administração vem do e-mail
  if (!confirm(role === 'leader' ? t().ldLogoutQ : t().lgSairQ)) return;
  if (role === 'leader' && CONECTADO) { sairDoLider(); return; }
  guardaToken('');
  sairDoPortal();
});

/* ==================================================================
   HISTÓRICO E CÓPIAS
   Só a administração enxerga. O histórico é a aba da planilha que só
   recebe linhas; as cópias são os arquivos guardados antes de cada
   gravação. Restaurar uma cópia guarda a versão atual primeiro, então
   dá para ir e voltar sem perder nada.
   ================================================================== */
let histAba = 'log';

function fecharHistorico() {
  const el = document.getElementById('histWrap');
  if (el) el.remove();
}

function abrirHistorico() {
  fecharHistorico();
  const wrap = document.createElement('div');
  wrap.id = 'histWrap';
  wrap.className = 'fixed inset-0 z-[85] flex items-end justify-center bg-ink/50 p-0 sm:items-center sm:p-6';
  wrap.innerHTML = `
    <div class="flex max-h-[88vh] w-full max-w-3xl flex-col overflow-hidden rounded-t-2xl border border-line bg-white sm:rounded-2xl">
      <div class="flex items-center gap-3 border-b border-line px-5 py-4">
        <i data-lucide="history" class="h-5 w-5 text-brand"></i>
        <h2 class="text-[15px] font-bold text-ink">${esc(t().hTitle)}</h2>
        <button type="button" id="histClose"
          class="ml-auto min-h-[36px] rounded-lg border border-line px-3 text-[13px] font-semibold text-ink hover:bg-slate-50">
          ${esc(t().hClose)}</button>
      </div>
      <div class="flex gap-2 border-b border-line px-5 py-3">
        <button type="button" data-haba="log" class="hist-aba">${esc(t().hTabLog)}</button>
        <button type="button" data-haba="copias" class="hist-aba">${esc(t().hTabCopies)}</button>
      </div>
      <div id="histBody" class="min-h-[160px] flex-1 overflow-y-auto px-5 py-4 text-[13px] leading-relaxed"></div>
    </div>`;
  document.body.appendChild(wrap);

  wrap.addEventListener('click', e => { if (e.target === wrap) fecharHistorico(); });
  document.getElementById('histClose').addEventListener('click', fecharHistorico);
  wrap.querySelectorAll('[data-haba]').forEach(b => b.addEventListener('click', () => {
    histAba = b.dataset.haba;
    pintarAbasHist();
    carregarHistorico();
  }));

  pintarAbasHist();
  carregarHistorico();
  if (window.lucide) lucide.createIcons();
}

function pintarAbasHist() {
  document.querySelectorAll('#histWrap [data-haba]').forEach(b => {
    const on = b.dataset.haba === histAba;
    b.className = 'hist-aba min-h-[36px] rounded-lg px-3 text-[13px] font-semibold ' +
      (on ? 'bg-brand text-white' : 'border border-line bg-white text-ink hover:bg-slate-50');
  });
}

const vazioHist = msg =>
  `<p class="rounded-xl border border-dashed border-line px-4 py-10 text-center text-slate-400">${esc(msg)}</p>`;

async function carregarHistorico() {
  const body = document.getElementById('histBody');
  if (!body) return;
  if (!CONECTADO) { body.innerHTML = vazioHist(t().hOffline); return; }
  body.innerHTML = vazioHist(t().hLoading);

  try {
    if (histAba === 'log') {
      const linhas = await servidorEd('listHistorico', 200);
      body.innerHTML = linhas.length
        ? `<ul class="divide-y divide-line">${linhas.map(linhaHist).join('')}</ul>`
        : vazioHist(t().hEmpty);
    } else {
      const copias = await servidorEd('listarCopias');
      body.innerHTML = copias.length
        ? `<p class="mb-3 text-slate-500">${esc(t().hCopiesNote)}</p>
           <ul class="divide-y divide-line">${copias.map(cardCopia).join('')}</ul>`
        : vazioHist(t().hCopiesEmpty);
      body.querySelectorAll('[data-rest]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm(t().hRestoreConfirm)) return;
        try {
          await servidorEd('restaurarCopia', b.dataset.rest);
          toast(t().hRestored, 4000);
          setTimeout(() => location.reload(), 1200);
        } catch (e) { toast(e.message, 6000); }
      }));
    }
  } catch (e) {
    body.innerHTML = vazioHist(e.message);
  }
  if (window.lucide) lucide.createIcons();
}

const COR_ACAO = {
  publicado: 'bg-leafsoft text-leafdark',
  editado:   'bg-brandsoft text-brand',
  apagado:   'bg-ambersoft text-amberdark',
  respondido:'bg-brandsoft text-brand',
  salvo:     'bg-slate-100 text-slate-600'
};

function linhaHist(r) {
  const cor = COR_ACAO[r.action] || COR_ACAO.salvo;
  return `<li class="py-3">
    <div class="flex flex-wrap items-center gap-2">
      <span class="rounded-md px-2 py-0.5 text-[12px] font-bold ${cor}">${esc(r.actionLabel)}</span>
      <span class="text-[12px] font-semibold text-slate-500">${esc(r.kindLabel)}</span>
      ${r.sector ? `<span class="text-[12px] text-slate-400">${esc(r.sector)}</span>` : ''}
      <span class="ml-auto text-[12px] text-slate-400">${esc(r.when)} · ${esc(r.who)}</span>
    </div>
    ${r.title ? `<p class="mt-1 font-semibold text-ink">${esc(r.title)}</p>` : ''}
    ${r.detail ? `<p class="mt-0.5 text-slate-500">${esc(r.detail)}</p>` : ''}
  </li>`;
}

function cardCopia(c) {
  return `<li class="flex flex-wrap items-center gap-3 py-3">
    <i data-lucide="archive" class="h-4 w-4 text-slate-400"></i>
    <span class="font-semibold text-ink">${esc(c.em)}</span>
    <button type="button" data-rest="${esc(c.id)}"
      class="ml-auto min-h-[36px] rounded-lg border border-line bg-white px-3 text-[13px] font-semibold text-ink hover:bg-slate-50">
      ${esc(t().hRestore)}</button>
  </li>`;
}

document.getElementById('btnHist').addEventListener('click', abrirHistorico);

/* ---------- arquivo de conteúdo ---------- */
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'joywork-conteudo.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      const ok = await saveContent({ ...defaultContent(), ...parsed }, {
        acao: 'salvo', tipo: 'conteudo',
        titulo: 'Conteúdo carregado de arquivo / ファイルから読み込み',
        detalhe: file.name
      });
      if (!ok) return;
      renderSection();
      toast(t().dLoaded);
    } catch { toast(t().nErr); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ---------- início ---------- */
(async () => {
  try {
  let expirou = false;
  if (CONECTADO) {
    try {
      const s = await servidor('sessao', TOKEN_LIDER);
      SESSAO_EMAIL = s.email || '';
      URL_PORTAL = s.url || '';
      if (s.admin) {
        role = 'admin';
        BLOQUEIOS = s.bloqueios || [];
        document.getElementById('roleBtn').classList.add('pointer-events-none', 'opacity-60');
      } else if (s.lider) {
        role = 'leader';
        LIDER = s.lider;
      } else {
        role = 'staff';
        if (TOKEN_LIDER) { guardaToken(''); expirou = true; }   // passou das 6 horas / 6時間経過
      }
    } catch (e) {
      role = 'staff';
    }
  }
  pintaFaixa();

  DATA = await loadContent();
  activeSector = resolveSector();
  draft.sector = activeSector || 'all';
  draftEmp.sector = activeSector || DATA.sectors[0]?.id || '';
  renderSectorMenu();
  if (activeSector) {
    const menu = document.getElementById('sectorMenu');
    menu.classList.remove('hidden');
    sectorToggle.setAttribute('aria-expanded', 'true');
    document.getElementById('sectorChevron').style.transform = 'rotate(180deg)';
  }
  // quem é: líder conectado, ou o código lembrado neste aparelho / 利用者の識別
  if (role === 'leader' && LIDER) USUARIO = LIDER.codigo;
  else if (role === 'staff') {
    const lembrado = empByCode(codigoGuardado());
    if (lembrado) USUARIO = lembrado.code; else guardaCodigo('');
  }
  applyLang();
  applyRole();
  lucide.createIcons();
  if (expirou) toast(t().ldExpired, 5000);
  if (role === 'staff' && !USUARIO) abrirLogin();   // ainda não se identificou / 未ログイン
  } catch (err) {
    if (window.__mostraErro) window.__mostraErro('inicio: ' + (err && err.message ? err.message : err));
    throw err;
  }
})();
</script>
